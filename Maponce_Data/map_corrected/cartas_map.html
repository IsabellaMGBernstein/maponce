<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mapping Maponce</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&family=Archivo+Narrow:wght@400;500;600&display=swap">
<style>
/* Layout: one-screen instrument. Header strip, map + letter register side by side, chronotope timeline across the foot. */
:root{
  --paper:#eef1f3; --panel:#f8f9fa; --ink:#1c2430; --muted:#5b6675; --rule:#cfd5dc;
  --hk:#b3262e;      /* letters sent from Hong Kong  */
  --yk:#1f4f9a;      /* letters sent from Yokohama   */
  --sun:#c8961a;     /* selection highlight          */
  --node:#2b3440; --trace:#8f99a6; --band:#e2e6ea;
  --display:"Old Standard TT", "Iowan Old Style", Georgia, serif;
  --ui:"Archivo Narrow", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#12161c; --panel:#181d24; --ink:#e4e8ec; --muted:#98a3b0; --rule:#2c343e;
  --hk:#e0545b; --yk:#6f9be0; --sun:#e5b43c; --node:#d5dbe1; --trace:#5d6774; --band:#232a33; color-scheme:dark } }
:root[data-theme="dark"]{
  --paper:#12161c; --panel:#181d24; --ink:#e4e8ec; --muted:#98a3b0; --rule:#2c343e;
  --hk:#e0545b; --yk:#6f9be0; --sun:#e5b43c; --node:#d5dbe1; --trace:#5d6774; --band:#232a33; color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font:15px/1.4 var(--ui);display:flex;flex-direction:column;overflow:hidden}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sun);outline-offset:2px}

header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 22px;padding:12px 18px 10px;border-bottom:1px solid var(--rule)}
h1{font:700 22px/1.1 var(--display);margin:0;text-wrap:balance}
h1 em{font-weight:400}
.sub{color:var(--muted);font-size:14px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;margin-left:auto;font-size:13px;color:var(--muted);align-items:center}
.key{display:inline-flex;align-items:center;gap:6px}
.sw{width:22px;height:0;border-top:3px solid currentColor;display:inline-block}
.sw.dash{border-top-style:dashed}

main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 360px}
#map{min-height:0;background:var(--paper)}
aside{min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--panel);border-left:1px solid var(--rule)}
.reg-head{padding:12px 16px 8px;border-bottom:1px solid var(--rule);display:flex;flex-direction:column;gap:6px}
.reg-head h2{font:700 17px/1.2 var(--display);margin:0}
.reg-meta{color:var(--muted);font-size:13px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--band);border:1px solid var(--rule);border-radius:999px;padding:1px 4px 1px 10px;font-size:13px;color:var(--ink)}
.chip button{border:0;background:none;cursor:pointer;padding:0 6px;font-size:15px;line-height:1;color:var(--muted)}
#list{list-style:none;margin:0;padding:0;overflow-y:auto;flex:1}
#list li{border-bottom:1px solid var(--rule)}
#list button{all:unset;display:grid;grid-template-columns:44px 1fr;gap:2px 10px;padding:9px 16px;cursor:pointer;width:100%;box-sizing:border-box}
#list button:hover{background:var(--band)}
#list button:focus-visible{outline:2px solid var(--sun);outline-offset:-2px}
#list li.on button{background:var(--band);box-shadow:inset 3px 0 0 var(--sun)}
.no{font:700 15px/1.2 var(--display);grid-row:span 3;padding-top:1px}
.no small{display:block;font:500 11px var(--ui);color:var(--muted);letter-spacing:.04em;font-variant-numeric:tabular-nums}
.who{font-weight:600}
.where{font-size:13px;color:var(--muted)}
.where .o{font-weight:600}
.o.hk{color:var(--hk)} .o.yk{color:var(--yk)}
.tag{font-size:11px;letter-spacing:.05em;text-transform:uppercase;border:1px solid var(--rule);border-radius:3px;padding:0 4px;margin-left:4px;color:var(--muted)}
.sum{font:italic 14px/1.35 var(--display);color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.empty{padding:20px 16px;color:var(--muted)}

footer{border-top:1px solid var(--rule);background:var(--panel);padding:8px 18px 10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.controls{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;font-size:14px;margin-bottom:4px}
.btn{border:1px solid var(--rule);background:var(--paper);border-radius:4px;padding:3px 12px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--muted)}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.controls label{display:inline-flex;gap:6px;align-items:center;color:var(--muted);cursor:pointer}
.controls select{background:var(--paper);border:1px solid var(--rule);border-radius:4px;padding:2px 4px}
#range{font:700 15px var(--display);margin-left:auto;font-variant-numeric:tabular-nums}
#tl{width:100%;height:118px;display:block;touch-action:none;cursor:crosshair;user-select:none}
#tl text{font-family:var(--ui);font-size:11px;fill:var(--muted)}
#tl .yr{font-size:12px;font-weight:600;fill:var(--ink)}
#tl .bandlab{font-size:11px;font-weight:600}
.hint{font-size:12px;color:var(--muted)}

/* Map key (bottom-left control) */
.map-key{background:var(--panel);color:var(--ink);border:1px solid var(--rule);border-radius:6px;box-shadow:0 1px 8px rgb(0 0 0 / .18);width:250px;font:12px/1.3 var(--ui);margin-bottom:14px!important}
.map-key summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;padding:7px 10px;font:700 14px var(--display)}
.map-key summary::-webkit-details-marker{display:none}
.map-key summary::after{content:"–";font:600 15px var(--ui);color:var(--muted)}
.map-key:not([open]) summary::after{content:"+"}
.map-key ul{list-style:none;margin:0;padding:2px 10px 8px;display:grid;gap:5px;border-top:1px solid var(--rule);padding-top:8px}
.map-key li{display:grid;grid-template-columns:30px 1fr;gap:8px;align-items:center}
.map-key svg{width:30px;height:16px;display:block;margin-top:1px}
.map-key b{font-weight:600}
.map-key .act{color:var(--muted)}
.map-key .foot{padding:6px 10px 8px;border-top:1px solid var(--rule);color:var(--muted)}
/* Leaflet skinning */
.osm-dark .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.85) contrast(.9) saturate(.6)}
.leaflet-tile-pane{opacity:.85}
.leaflet-container{font:13px/1.35 var(--ui);background:var(--paper)}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--panel);color:var(--ink);border-radius:6px;box-shadow:0 2px 14px rgb(0 0 0 / .25)}
.leaflet-popup-content{margin:12px 14px;max-height:340px;overflow:auto}
.leaflet-container a.leaflet-popup-close-button{color:var(--muted)}
.leaflet-bar a{background:var(--panel);color:var(--ink);border-bottom-color:var(--rule)}
.leaflet-control-attribution{background:color-mix(in srgb,var(--panel) 80%,transparent)!important;color:var(--muted)}
.leaflet-control-attribution a{color:var(--muted)}
.plabel{background:none;border:0;box-shadow:none;padding:0;color:var(--ink);font:600 12px var(--ui);text-shadow:0 0 3px var(--paper),0 0 3px var(--paper),0 0 2px var(--paper)}
.plabel::before{display:none}
.plabel.origin{font:700 14px var(--display)}
.osq{width:14px;height:14px;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--ink)}
.osq.hk{background:var(--hk)} .osq.yk{background:var(--yk)}
.osq.away{opacity:.35}
.pop h3{font:700 16px/1.2 var(--display);margin:0 0 4px}
.pop .meta{color:var(--muted);margin-bottom:6px}
.pop .sum{-webkit-line-clamp:unset;display:block;margin:6px 0;color:var(--ink)}
.pop dl{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:6px 0 0;font-size:12px}
.pop dt{color:var(--muted)} .pop dd{margin:0}
.pop ul{margin:4px 0 0;padding-left:16px}
.pop li{margin:2px 0}
.pop .lk{all:unset;cursor:pointer;text-decoration:underline;text-underline-offset:2px}

@media (max-width:800px){
  body{overflow:auto;height:auto}
  main{grid-template-columns:1fr;flex:none}
  #map{height:58vh}
  aside{border-left:0;border-top:1px solid var(--rule)}
  #list{max-height:none;overflow:visible}
  footer{order:-1;position:sticky;top:0;z-index:1000}
  .legend{margin-left:0}
  header{order:-2}
  h1{font-size:19px}
}
@media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important} }
</style>
</head>
<body>
<header>
  <h1>Cartas de Mariano Ponce <em>1897–1900</em></h1>
  <span class="sub" id="stats"></span>
  <div class="legend" aria-label="Legend">
    <span class="key" style="color:var(--hk)"><span class="sw"></span>sent from Hong Kong</span>
    <span class="key" style="color:var(--yk)"><span class="sw"></span>sent from Yokohama</span>
    <span class="key"><span class="sw dash"></span>destination inferred</span>
    <span class="key">line width = number of letters</span>
  </div>
</header>

<main>
  <div id="map" role="region" aria-label="Map of letters"></div>
  <aside>
    <div class="reg-head">
      <h2>Letters in view</h2>
      <div class="reg-meta"><span id="count"></span><span id="filter"></span></div>
    </div>
    <ul id="list"></ul>
  </aside>
</main>

<footer>
  <div class="controls">
    <button class="btn" id="play" aria-pressed="false">▶ Play</button>
    <label for="win">Window
      <select id="win">
        <option value="1">1 month</option>
        <option value="3" selected>3 months</option>
        <option value="6">6 months</option>
        <option value="12">12 months</option>
      </select></label>
    <button class="btn" id="all">Show all</button>
    <label><input type="checkbox" id="trace" checked> Earlier letters as faint trace</label>
    <label><input type="checkbox" id="inf" checked> Include inferred destinations</label>
    <span id="range"></span>
  </div>
  <svg id="tl" aria-label="Timeline of letters per month. Drag to choose a period."></svg>
  <div class="hint">Drag across the timeline to choose a period, or click a month. The band above the bars shows where Ponce was living.</div>
</footer>

ge.”-—Favorable acogida en Japón.—Fotografías de la dotación del “Nonubiki Marú” y de Mr. Nakamura antes del desastre.—Esperanzas de encontrar ayuda.— Una suscripción de $300,000 entre los entusiastas del engrandecimiento del Extremo Oriente.—Otro proyecto.—El mapa de Dalmonte", "images": "page_429.jpg | page_430.jpg | page_431.jpg", "pages": "389 | 390 | 391", "flags": "", "dest": "Hong Kong", "dest_kind": "printed", "dest_basis": "printed in addressee block: \"Hongkong\"", "olat": 35.4437, "olon": 139.638, "dlat": 22.2819, "dlon": 114.158}, {"n": 198, "id": "ponce-198", "date": "1899-08-11", "sender": "Mariano Ponce", "signed": "M. Ponce", "origin": "Yokohama", "origin_basis": "place/date line", "part": "PONCE EN YOKOHAMA (JAPÓN)", "recipient": "L. Castro", "recipient_printed": "Castro", "dateline": "637 Miyokojí Yama, Kitagata, Korakigun, Yokohama, 11 de Agosto de 1899.", "addressee": "Sr. L. Castro, Esq., | Shanghai.", "summary": "Telegrama que no pudo descifrarse.—Socorro a Manuel.—Que embarque para Yokohama.—Por la Patria.—Nuestro Pueblo sostendrá la guerra confiado en el triunfo final", "images": "page_432.jpg | page_433.jpg", "pages": "392 | 393", "flags": "", "dest": "Shanghai", "dest_kind": "printed", "dest_basis": "printed in addressee block: \"Shanghai\"", "olat": 35.4437, "olon": 139.638, "dlat": 31.2304, "dlon": 121.4737}, {"n": 199, "id": "ponce-199", "date": "1899-08-14", "sender": "Mariano Ponce", "signed": "Naning", "origin": "Yokohama", "origin_basis": "place/date line", "part": "PONCE EN YOKOHAMA (JAPÓN)", "recipient": "A. Vergel de Dios", "recipient_printed": "Vergel", "dateline": "637 Miyokojí Yama, Kitagata, Korakigun, Yokohama, 14 de Agosto de 1899.", "addressee": "", "summary": "Sin noticias del hogar.—La mutua ayuda.—A Hongkong y luego procurará llegar a Manila.—No hay tal rendición de los nuestros.—Más que nunca animosos.—Consiguen fabricar cartuchos para resistir.—Fe en el triunfo por medio de la resistencia.—Miles de americanos enfermos 3", "flags": "", "dest": "Tokyo", "dest_kind": "printed", "dest_basis": "printed in addressee block: \"Tokyo\"", "olat": 35.4437, "olon": 139.638, "dlat": 35.6895, "dlon": 139.6917}, {"n": 206, "id": "ponce-206", "date": "1899-10-07", "sender": "Mariano Ponce", "signed": "M. Ponce", "origin": "Hong Kong", "origin_basis": "place/date line", "part": "PONCE CON LICENCIA, EN HONGKONG", "recipient": "A. Villareal", "recipient_printed": "Villa-real", "dateline": "Hongkong, 7 de Octubre de 1899.", "addressee": "Sr. D. A. Villareal, | Tokyo.", "summary": "Comisión importante en América encomendada al Sr. Del Pan.—A propuesta de Ponce, Antonio Villa-Real es designado secretario de Del Pan por la Junta Central de Hongkong.—Animado a servir a nuestro País y a proseguir sus estudios", "images": "page_444.jpg | page_445.jpg", "pages": "404 | 405", "flags": "", "dest": "Tokyo", "dest_kind": "printed", "dest_basis": "printed in addressee block: \"Tokyo\"", "olat": 22.2819, "olon": 114.158, "dlat": 35.6895, "dlon": 139.6917}, {"n": 207, "id": "ponce-207", "date": "1899-10-16", "sender": "Mariano Ponce", "signed": "M. Ponce", "origin": "Hong Kong", "origin_basis": "place/date line", "part": "PONCE CON LICENCIA, EN HONGKONG", "recipient": "K. Sugimura", "recipient_printed": "Sugimura", "dateline": "2 Lower Castle Terrace, Oct. 16, 1899.", "addressee": "F. Sugimura, Esq., | Tokyo.", "summary": "Carta que vá y vuelve.—Nuestra cuestión adquiere buen aspecto.—El pueblo sostendrá la guerra.—El Imperialismo se debilita. —Captura del cañonero americano “Urdaneta” con cañones y municiones. —También muchos prisioneros", "images": "page_445.jpg | page_446.jpg", "pages": "405 | 406", "flags": "", "dest": "Tokyo", "dest_kind": "printed", "dest_basis": "printed in addressee block: \"Tokyo\"", "olat": 22.2819, "olon": 114.158, "dlat": 35.6895, "dlon": 139.6917}, {"n": 208, "id": "ponce-208", "date": "1899-10-16", "sender": "Mariano Ponce", "signed": "", "origin": "Hong Kong", "origin_basis": "inferred from book part (Ponce's residence)", "part": "PONCE CON LICENCIA, EN HONGKONG", "recipient": "Sun Yat Sen", "recipient_printed": "Sun Yat Sen", "dateline": "Oct. 16, 1899.", "addressee": "Dr. Sun Yat Sen.", "summary": "Llega a Hongkong.—¿Cómo están nuestros asuntos Dr. Sun Yat Sen?—Bastan dos millones y medio de balas.—El remanente del dinero para compra de rifles.—No haya demoras.—A la vuelta del barco habrá recursos.—Información del desastre, y solicitud de socorro para los damnificados, ya enviadas", "images": "page_447.jpg", "pages": "407", "flags": "", "dest": "Yokohama", "dest_kind": "inferred", "dest_basis": "inferred from letter 238 to the same recipient (1900-02-02, 109 days apart)", "olat": 22.2819, "olon": 114.158, "dlat": 35.4437, "dlon": 139.638}, {"n": 209, "id": "ponce-209", "date": "1899-10-17", "sender": "Mariano Ponce", "signed": "", "origin": "Hong Kong", "origin_basis": "place/date line", "part": "PONCE CON LICENCIA, EN HONGKONG", "recipient": "Francisco Rivero", "recipient_printed": "Rivero", "dateline": "2 Lower Castle Terrace, 17 de Octubre, 1899.", "addressee": "Sr. F. Rivero, Esq., | Yokohama.", "summary": "El telegrama al Dr. Sun Yat Sen.—El préstamo a Rivero.—Le pagará el Gobierno.—Cartas para Del Pan.—Combates en los alrededores de Manila.—Tondo, Sampaloc y Santa Ana.—Los yankees cabizbajos, viendo mayores dificultades", "images": "page_448.jpg | page_449.jpg", "pages": "408 | 409", "flags": "", "dest": "Yokohama", "dest_kind": "printed", "dest_basis": "printed in addressee block: \"Yokohama\"", "olat": 22.2819, "olon": 114.158, "dlat": 35.4437, "dlon": 139.638}, {"n": 210, "id": "ponce-210", "date": "1899-10-20", "sender": "Mariano Ponce", "signed": "M. Ponce", "origin": "Hong Kong", "origin_basis": "place/date line", "part": "PONCE CON LICENCIA, EN HONGKONG", "recipient": "Fernando Blumentritt", "recipient_printed": "Blumentritt", "dateline": "Hongkong, 20 de Octubre de 1899.", "addressee": "Sr. D. F. Blumentritt, | Leitmeritz.", "summary": "Alentadoras noticias.—Los sandatajanes atacaron los destacamentos de Kalookan y alrededores de Manila.—Kabite casi recuperada.—Muchos prisioneros yankees con un capitán.—Por la Independencia.— Los americanistas desanimados.—“El Filipino Libre” muerto de inanición.—'“La Democracia'” a punto de perecer.—Pardo, acompañando siempre al Gral. Alejandrino que condujo prisioneros americanos a Manila", "images": "page_450.jpg", "pages": "410", "flags": "", "dest": "Leitmeritz (Litoměřice)", "dest_kind": "printed", "dest_basis": "printed in addressee block: \"Leitmeritz\"", "olat": 22.2819, "olon": 114.158, "dlat": 50.5335, "dlon": 14.1318}, {"n": 211, "id": "ponce-211", "date": "1899-10-26", "sender": "Mariano Ponce", "signed": "M. Ponce", "origin": "Hong Kong", "origin_basis": "place/date line", "part": "PONCE CON LICENCIA, EN HONGKONG", "recipient": "Felipe Buencamino", "recipient_printed": "Buencamino", "dateline": "Hongkong, 26 de Octubre de 1899.", "addressee": "Sr. Felipe Buencamino, | Secretario de Negocios Extranjeros | de la República Filipina.", "summary": "Agradeciendo la confianza y las credenciales.—Enfermo en Hongkong.— Ningún informe aún sobre política japonesa, por su dolencia.—Detalles adelantados: —El entusiasmo japonés por nuestra Causa.—La prensa unánime por nuestra Independencia. —Que el Gobierno intervenga en favor nuestro. —Protestas contra el ministro Aoki por su débil política orientalista.—Filipinas, China y Korea.—Que seremos un factor importante para una alianza.—“La Cuestión Filipina” en japonés. —Algo positivo del Japón", "images": "page_451.jpg | page_452.jpg", "pages": "411 | 412", "flags": "", "dest": "", "dest_kind": "unlocated", "dest_basis": "no place printed or inferable", "olat": 22.2819, "olon": 114.158, "dlat": null, "dlon": null}, {"n": 212, "id": "ponce-212", "date": "1899-10-27", "sender": "Mariano Ponce", "signed": "M. Ponce", "origin": "Hong Kong", "origin_basis": "place/date line", "part": "PONCE CON LICENCIA, EN HONGKONG", "recipient": "Apolinario Mabini", "recipient_printed": "Mabini", "dateline": "Hongkong, 27 de Octubre de 1899.", "addressee": "Sr, D. Apolinario Mabini, | Tárlac.", "summary": "Silencio por dificultad de comunicaciones.—El heroísmo filipino admírado.—La opinión internacional a nuestro favor.—Felicitando a Mabini.—Noticias desalentadoras del bando contrario. —Muerte de “El Filipino Libre.””—““La Democracia” tambalea también.—Interesantes artículos de Mabini en “La Independencia.”—Sus opiniones voceadas en Japón.—Filipinos y japoneses juntos y armónicos.—Todos los partidos unánimes por nuestra Independencia", "images": "page_453.jpg | page_454.jpg", "pages": "413 | 414", "flags": "date confirmed on page image", "dest": "Tarlac", "dest_kind": "printed", "dest_basis": "printed in addressee block: \"Tárlac\"", "olat": 22.2819, "olon": 114.158, "dlat": 15.4802, "dlon": 120.5979}, {"n": 213, "id": "ponce-213", "date": "1899-10-30", "sender": "Mariano Ponce", "signed": "M. Ponce", "origin": "Hong Kong", "origin_basis": "place/date line", "part": "PONCE CON LICENCIA, EN HONGKONG", "recipient": "L. Castro", "recipient_printed": "Castro", "dateline": "Hongkong, 30 de Octubre de 1899.", "addressee": "Sr. D. L. Castro, | Shanghai.", "summary": "La decisión del caso del sub-teniente Asencio, ya remitida.—Enfermo aún. —Buen aspecto de nuestro asunto por la firme actitud del pueblo.— El Partido imperialista se vá desintegrando.—Kabite casi recuperada.—Ángeles y San Fernando de la Pampanga, también. —Apresados los cañoneros “Urdaneta” y “Callao”” con prisioneros, armas y dinero.— Notas alentadoras", "images": "page_455.jpg", "pages": "415", "flags": "", "dest": "Shanghai", "dest_kind": "printed", "dest_basis": "printed in addressee block: \"Shanghai\"", "olat": 22.2819, "olon": 114.158, "dlat": 31.2304, "dlon": 121.4737}, {"n": 214, "id": "ponce-214", "date": "1899-11-03", "sender": "Mariano Ponce", "signed": "M. Ponce", "origin": "Hong Kong", "origin_basis": "place/date line", "part": "PONCE CON LICENCIA, EN HONGKONG", "recipient": "Sonetaka Foujita", "recipient_printed": "Foujita", "dateline": "2 Lower Castle Terrace, 3 de Noviembre de 1899.", "addressee": "Sr. D. S. Foujita, | Tokyo.", "summary": "El Código Civil japonés en francés y la versión japonesa de nuestra Constitución.—Foujita e Iwaii investigados por la Policía por causa nuestra. —Agradeciendo al oficial japonés que se ofrece a pelear por nuestra Independencia.—Imposible enviar allá refuerzos por la vigilancia americana.—Ya han cogido prisioneros en Manila a varios japoneses.—Algunos periódicos ya informaron que oficiales japoneses están en nuestro Ejército", "images": "page_456.jpg | page_457.jpg | page_458.jpg", "pages": "416 | 417 | 418", "flags": "", "dest": "Tokyo", "dest_kind": "printed", "dest_basis": "printed in addressee block: \"Tokyo\"", "olat": 22.2819, "olon": 114.158, "dlat": 35.6895, "dlon": 139.6917}, {"n": 215, "id": "ponce-215", "date": "1899-11-10", "sender": "Mariano Ponce", "signed": "M. Ponce", "origin": "Hong Kong", "origin_basis": "place/date line", "part": "PONCE CON LICENCIA, EN HONGKONG", "recipient": "Sonetaka Foujita", "recipient_printed": "Foujita", "dateline": "2 Lower Castle Terrace, 10 de Noviembre de 1899.", "addressee": "Sr. Foujita, Esq., | Tokyo.", "summary": "Encargo de letras y tipos de imprenta en el ““Tsukiji Type Foundry”” de Tokyo para el Comité revolucionario de Hongkong.—Se le ha comunicado al Sr. Rivero para que dé el dinero necesario para dicho encargo y remita el pedido al Comité", "images": "page_458.jpg | page_459.jpg", "pages": "418 | 419", "flags": "", "dest": "Tokyo", "dest_kind": "printed", "dest_basis": "printed in addressee block: \"Tokyo\"", "olat": 22.2819, "olon": 114.158, "dlat": 35.6895, "dlon": 139.6917}, {"n": 216, "id": "ponce-216", "date": "1899-11-10", "sender": "Mariano Ponce", "signed": "M. Ponce", "origin": "Hong Kong", "origin_basis": "place/date line", "part": "PONCE CON LICENCIA, EN HONGKONG", "recipient": "Francisco Rivero", "recipient_printed": "Rivero", "dateline": "2 Lower Castle Terrace, 10 de Noviembre de 1899.", "addressee": "Sr. D. Francisco Rivero, | Yokohama.", "summary": "Agradeciendo las cortesías a Del Pan.—Que facilite a Foujita dinero para los tipos de imprenta del Comité Central.—Se aprecia su ayuda a la Causa.—El Ideal va ganando terreno.—Hoja con traducciones de la prensa extranjera", "images": "page_460.jpg | page_461.jpg", "pages": "420 | 421", "flags": "", "dest": "Yokohama", "dest_kind": "printed", "dest_basis": "printed in addressee block: \"Yokohama\"", "olat": 22.2819, "olon": 114.158, "dlat": 35.4437, "dlon": 139.638}, {"n": 217, "id": "ponce-217", "date": "1899-11-15", "sender": "Mariano Ponce", "signed": "", "origin": "Hong Kong", "origin_basis": "place/date line", "part": "PONCE CON LICENCIA, EN HONGKONG", "recipient": "K. Sugimura", "recipient_printed": "Sugimura", "dateline": "2 Lower Castle Terrace, November 15th, 1899.", "addressee": "Mr. K. Sugimura, Esq., | Editor of “The Orient,” | Tokyo.", "summary": "Recibidos los recortes de Jos. Wade.—Agradeciendo sus simpatías.—Se le enviarán informes.—Esperanzas de triunfo.—Resueltos a sostener la Independencia.—Dice el Gral. Aguinaldo: “Podrá ser que perdamos las esperanzas de triunfo, más no la de morir por nuestra Independencia.” —La copia de nuestra Constitución", "images": "page_461.jpg | page_462.jpg", "pages": "421 | 422", "flags": "", "dest": "Tokyo", "dest_kind": "printed", "dest_basis": "printed in addressee block: \"Tokyo\"", "olat": 22.2819, "olon": 114.158, "dlat": 35.6895, "dlon": 139.6917}, {"n": 218, "id": "ponce-218", "date": "1899-11-15", "sender": "Mariano Ponce", "signed": "M. Ponce", "origin": "Hong Kong", "origin_basis": "place/date line", "part": "PONCE CON LICENCIA, EN HONGKONG", "recipient": "Hirata", "recipient_printed": "Hirata", "dateline": "2 Lower Castle Terrace, Hongkong, November 15th, 1899.", "addressee": "Mr. Hirata, Esq., | Osaka.", "summary": "Cordiales expresiones de Aguinaldo a Hirata.—Buen aspecto de la Causa.— La política americana del terror en Filipinas solo provoca protestas de todo pueblo honrado.—A luchar hasta el fin por la libertad.—Se mantiene el excelente espíritu de nuestro pueblo.— Nada importan los sufrimientos por la libertad.— Reiterando las gracias por sus cortesías en Osaka", "images": "page_463.jpg | page_464.jpg | page_465.jpg", "pages": "423 | 424 | 425", "flags": "", "dest": "Osaka", "dest_kind": "printed", "dest_basis": "printed in addressee block: \"Osaka\"", "olat": 22.2819, "olon": 114.158, "dlat": 34.6937, "dlon": 135.5023}, {"n": 219, "id": "ponce-219", "date": "1899-11-17", "sender": "Mariano Ponce", "signed": "M. Ponce", "origin": "Hong Kong", "origin_basis": "place/date line", "part": "PONCE CON LICENCIA, EN HONGKONG", "recipient": "Presidente del Subcomité Republicano Filipino de Barcelona", "recipient_printed": "Presidente del Subcomité Republicano", "dateline": "Hongkong, 17 de Noviembre de 1899.", "addressee": "Sr. Presidente del Subcomité | Republicano Filipino de Barcelona.", "summary": "Filipino de Barcelona Subcomité republicano en Barcelona.—¡Qué cambios radicales en las cosas! —““Ahora ya unidos con los lazos de la Patria.”—Venís á unir vuestros esfuerzos con los de todos.—¡ Hosanna !—Conquistad las simpatías españolas. —Filipinas libre, más útil á España", "images": "page_465.jpg | page_466.jpg | page_467.jpg", "pages": "425 | 426 | 427", "flags": "", "dest": "Barcelona", "dest_kind": "printed", "dest_basis": "printed in addressee block: \"\"", "olat": 22.2819, "olon": 114.158, "dlat": 41.3851, "dlon": 2.1734}, {"n": 220, "id": "ponce-220", "date": "1899-11-17", "sender": "Mariano Ponce", "signed": "M. Ponce", "origin": "Hong Kong", "origin_basis": "place/date line", "part": "PONCE CON LICENCIA, EN HONGKONG", "recipient": "Fernando Blumentritt", "recipient_printed": "Blumentritt", "dateline": "2 Lower Castle Terrace, 17 de Noviembre de 1899.", "addressee": "Sr. D. F. Blumentritt, | Leitmeritz.", "summary": "Continuos desvelos en bien de nuestro país. —Disgustos entre los amerícanistas de Manila.—Imitan la política colonial española.—Romero Salas editará ““El Correo de Oriente” en Hongkong.—Defenderá la Independencia de nuestro pueblo.—Marcha bien nuestro plan de guerrillas", "images": "page_467.jpg | page_468.jpg | page_469.jpg", "pages": "427 | 428 | 429", "flags": "", "dest": "Leitmeritz (Litoměřice)", "dest_kind": "printed", "dest_basis": "printed in addressee block: \"Leitmeritz\"", "olat": 22.2819, "olon": 114.158, "dlat": 50.5335, "dlon": 14.1318}, {"n": 221, "id": "ponce-221", "date": "1899-11-17", "sender": "Mariano Ponce", "signed": "M. Ponce", "origin": "Hong Kong", "origin_basis": "inferred from book part (Ponce's residence)", "part": "PONCE CON LICENCIA, EN HONGKONG", "recipient": "A. B. Meyer", "recipient_printed": "Meyer", "dateline": "Nov. 17th, 1899.", "addressee": "Mr. A. B. Meyer, Esq., | Dresden.", "summary": "Felicitando por el aniversario de su nombramiento como Director del Museo de Dresden.—No olvidamos su gran servicio popularizando en el mundo culto las cosas de Filipinas", "images": "page_469.jpg | page_470.jpg", "pages": "429 | 430", "flags": "", "dest": "Dresden", "dest_kind": "printed", "dest_basis": "printed in addressee block: \"Dresden\"", "olat": 22.2819, "olon": 114.158, "dlat": 51.0504, "dlon": 13.7373}, {"n": 222, "id": "ponce-222", "date": "1899-11-20", "sender": "Mariano Ponce", "signed": "M. Ponce", "origin": "Hong Kong", "origin_basis": "place/date line", "part": "PONCE CON LICENCIA, EN HONGKONG", "recipient": "Arajiro Miura", "recipient_printed": "Miura", "dateline": "2 Lower Castle Terrace, 20 de Noviembre de 1899.", "addressee": "Sr. Arajiro Miura, | Legación Japonesa en México.", "summary": "Gran simpatía demuestra el pueblo mejicano por nuestra causa.—A resistir hasta el último extremo.—60,000 soldados fraccionados en pequeñas unidades fáciles de ser copadas.—Los americanistas nada significan para el Ideal.—Nuestra esperanza en el triunfo de los anti-imperialistas", "images": "page_471.jpg | page_472.jpg", "pages": "431 | 432", "flags": "", "dest": "Mexico City", "dest_kind": "printed", "dest_basis": "printed in addressee block: \"México\"", "olat": 22.2819, "olon": 114.158, "dlat": 19.4326, "dlon": -99.1332}, {"n": 223, "id": "ponce-223", "date": "1899-11-20", "sender": "Mariano Ponce", "signed": "", "origin": "Hong Kong", "origin_basis": "place/date line", "part": "PONCE CON LICENCIA, EN HONGKONG", "recipient": "William Henry Coard", "recipient_printed": "Coard", "dateline": "Hongkong, November 20th, 1899.", "addressee": "2 Lower Castle Terrace. | Mr. W. H. Coard, Esq.", "summary": "Animado á trabajar por nuestra Causa.—Se ofrece ir á Estados Unidos pero ya es tarde.—Establezca comunicación telegráfica con el Comité Central.—A desmentir y refutar falsedades.—Le enviaremos informes verídicos del campo revolucionario.— Su nombramiento como Representante en América bajo consideración", "images": "page_473.jpg | page_474.jpg | page_475.jpg | page_476.jpg", "pages": "433 | 434 | 435 | 436", "flags": "", "dest": "Montreal", "dest_kind": "inferred", "dest_basis": "inferred from letter 224 to the same recipient (1899-11-23, 3 days apart)", "olat": 22.2819, "olon": 114.158, "dlat": 45.5019, "dlon": -73.5674}, {"n": 224, "id": "ponce-224", "date": "1899-11-23", "sender": "Mariano Ponce", "signed": "", "origin": "Hong Kong", "origin_basis": "place/date line", "part": "PONCE CON LICENCIA, EN HONGKONG", "recipient": "William Henry Coard", "recipient_printed": "Coard", "dateline": "Hongkong, Noviembre 23, 1899.", "addressee": "2 Lower Castle, Terrace. | Mr. W. H. Coard, Esq., | “The Gazette” office, | Montreal, Canada.", "summary": "¿Habla Aguinaldo por y representa a todos los Filipinos? Opinión negativa de Schurman.—Lo que dice McKinley.—Importantes hechos históricos contestan afirmativamente.—Carta de un sol. dado á su padre delatando la barbarie militar americana— Carta gesticulante del Prof. Jordan de la Universidad de Stanford", "images": "page_477.jpg | page_478.jpg | page_479.jpg | page_480.jpg | page_481.jpg | page_482.jpg | page_483.jpg", "pages": "437 | 438 | 439 | 440 | 441 | 442 | 443", "flags": "no index entry found by OCR; part/year taken from preceding letter", "dest": "Montreal", "dest_kind": "printed", "dest_basis": "printed in addressee block: \"Montreal, Canada\"", "olat": 22.2819, "olon": 114.158, "dlat": 45.5019, "dlon": -73.5674}, {"n": 225, "id": "ponce-225", "date": "1899-11-24", "sender": "Mariano Ponce", "signed": "M. Ponce", "origin": "Hong Kong", "origin_basis": "place/date line", "part": "PONCE CON LICENCIA, EN HONGKONG", "recipient": "Fernando Blumentritt", "recipient_printed": "Blumentritt", "dateline": "Hongkong, 24 de Noviembre de 1899.", "addressee": "Sr. D., F. Blumentritt, | Leitmeritz, Austria.", "summary": "El regalo de boda del Pueblo filipino á Loleng, hija de Blumentritt.— Nuestro pueblo jamás olvida al que consagró la vida a su bien.— Los americanos saben falsear y mentir más que los españoles.— En la toma de Tarlac sufrieron más de 800 bajas. —¡Cómo administran justicia !", "images": "page_484.jpg | page_485.jpg | page_486.jpg | page_487.jpg", "pages": "444 | 445 | 446 | 447", "flags": "", "dest": "Leitmeritz (Litoměřice)", "dest_kind": "printed", "dest_basis": "printed in addressee block: \"Leitmeritz, Austria\"", "olat": 22.2819, "olon": 114.158, "dlat": 50.5335, "dlon": 14.1318}, {"n": 226, "id": "ponce-226", "date": "1899-11-24", "sender": "Mariano Ponce", "signed": "M. Ponce", "origin": "Hong Kong", "origin_basis": "place/date line", "part": "PONCE CON LICENCIA, EN HONGKONG", "recipient": "Fernando Blumentritt", "recipient_printed": "Blumentritt", "dateline": "2 Lower Castle Terrace, Hongkong, 637 Miyokojí Yama, Kitagata, Yokohama, 24 de Noviembre de 1899.", "addressee": "Sr, D. Fernando Blumentritt, | Leitmeritz.", "summary": "Giro del regalo de boda á Loleng hija de Blumentritt.—Letra sobre Londres por valor de 396 libras esterlinas con 17 chelines y 6 peniques. —“Que ella sea feliz y dichosa”", "images": "page_488.jpg", "pages": "448", "flags": "", "dest": "Leitmeritz (Litoměřice)", "dest_kind": "printed", "dest_basis": "printed in addressee block: \"Leitmeritz\"", "olat": 22.2819, "olon": 114.158, "dlat": 50.5335, "dlon": 14.1318}, {"n": 227, "id": "ponce-227", "date": "1899-11-24", "sender": "Mariano Ponce", "signed": "M. Ponce", "origin": "Hong Kong", "origin_basis": "place/date line", "part": "PONCE CON LICENCIA, EN HONGKONG", "recipient": "Luis Cosp", "recipient_printed": "Cosp.", "dateline": "No. 2 Lower Castle Terrace, Noviembre 24, 1899.", "addressee": "Sr. D. Luis Cosp., | San Clemente de Llobregat.", "summary": "En Hongkong aún, recobrando la salud.—Noticias recibidas de Manila de los hermanos Tugas.—Pedro está empleado en “La Insular” y Silvestre sigue prisionero de los revolucionarios.—Se gestiona la libertad de éste.", "images": "page_489.jpg", "pages": "449", "flags": "", "dest": "Sant Climent de Llobregat", "dest_kind": "printed", "dest_basis": "printed in addressee block: \"San Clemente de Llobregat\"", "olat": 22.2819, "olon": 114.158, "dlat": 41.338, "dlon": 1.997}, {"n": 228, "id": "ponce-228", "date": "1899-11-25", "sender": "Mariano Ponce", "signed": "M. Ponce", "origin": "Hong Kong", "origin_basis": "place/date line", "part": "PONCE CON LICENCIA, EN HONGKONG", "recipient": "Francisco Rivero", "recipient_printed": "Rivero", "dateline": "2 Lower Castle Terrace, 25 de Noviembre de 1899.", "addressee": "Sr. D. F. Rivero, | Yokohama.", "summary": "Nuestra campaña sigue en buena situación.—Por la conducta pésima de los conquistadores los anhelos de Independencia se intensifican.— En los tribunales todo se resuelve por multas. —Mienten en sus informaciones con descaro.—Los tipos de imprenta", "images": "page_490.jpg | page_491.jpg", "pages": "450 | 451", "flags": "", "dest": "Yokohama", "dest_kind": "printed", "dest_basis": "printed in addressee block: \"Yokohama\"", "olat": 22.2819, "olon": 114.158, "dlat": 35.4437, "dlon": 139.638}, {"n": 229, "id": "ponce-229", "date": "1899-12-01", "sender": "Mariano Ponce", "signed": "M. Ponce", "origin": "Hong Kong", "origin_basis": "place/date line", "part": "PONCE CON LICENCIA, EN HONGKONG", "recipient": "Isabelo de los Reyes", "recipient_printed": "De los Reyes", "dateline": "2 Lower Castle Terrace, Hongkong, 637 Miyokoji Yama, Kitagata, Yokohama (Japón), Diciembre 1, 1899.", "addressee": "Sr. D. Isabelo de Los Reyes, | Madrid.", "summary": "El periódico “Filipinas ante Europa.'”—Hoy más que nunca á trabajar por nuestra Causa.—Es lucha terrible de vida Ó muerte.—La revista “The Orient.”—En un banquete de simpatía á nuestro País", "images": "page_491.jpg | page_492.jpg", "pages": "451 | 452", "flags": "", "dest": "Madrid", "dest_kind": "printed", "dest_basis": "printed in addressee block: \"Madrid\"", "olat": 22.2819, "olon": 114.158, "dlat": 40.4168, "dlon": -3.7038}, {"n": 230, "id": "ponce-230", "date": "1899-12-07", "sender": "Mariano Ponce", "signed": "M. Ponce", "origin": "Hong Kong", "origin_basis": "place/date line", "part": "PONCE CON LICENCIA, EN HONGKONG", "recipient": "Francisco Rivero", "recipient_printed": "Rivero", "dateline": "2 Lower Castle Terrace, 7 de Diciembre de 1899.", "addressee": "Sr. D. Francisco Rivero, | Yokohama.", "summary": "“'Adquieran tipos á cualquier precio.” —El Presidente agradece á Ponce y Rivero sus servicios á la Patria.—¡Cómo le hostilizamos al adversario!—Con nuestra táctica de guerrillas el enemigo tropieza con muchas dificultades.—Noticias satisfactorias de los anti-anexionistas.—““¡Esa estatua de la Libertad en Nueva York debe ser devuelta á Francia, y que se levante otra en Manila !”", "images": "page_492.jpg | page_493.jpg", "pages": "452 | 453", "flags": "", "dest": "Yokohama", "dest_kind": "printed", "dest_basis": "printed in addressee block: \"Yokohama\"", "olat": 22.2819, "olon": 114.158, "dlat": 35.4437, "dlon": 139.638}, {"n": 231, "id": "ponce-231", "date": "1899-12-11", "sender": "Mariano Ponce", "signed": "M. Ponce", "origin": "Hong Kong", "origin_basis": "place/date line", "part": "PONCE CON LICENCIA, EN HONGKONG", "recipient": "Francisco Rivero", "recipient_printed": "Rivero", "dateline": "Hongkong, 11 de Diciembre de 1899.", "addressee": "Sr. D. F. Rivero.", "summary": "El laureado pintor Luna.—Llegó de Francia el 3 de Diciembre hospedándose en el cuarto de Ponce.—Su rápida enfermedad.—El fatal desenlace. —“'¡Qué rudo golpe para nosotros!”", "images": "page_494.jpg", "pages": "454", "flags": "", "dest": "Yokohama", "dest_kind": "inferred", "dest_basis": "inferred from letter 230 to the same recipient (1899-12-07, 4 days apart)", "olat": 22.2819, "olon": 114.158, "dlat": 35.4437, "dlon": 139.638}, {"n": 232, "id": "ponce-232", "date": "1899-12-14", "sender": "Mariano Ponce", "signed": "M. Ponce", "origin": "Hong Kong", "origin_basis": "place/date line", "part": "PONCE CON LICENCIA, EN HONGKONG", "recipient": "Sonetaka Foujita", "recipient_printed": "Foujita", "dateline": "2 Lower Castle Terrace, 14 de Diciembre de 1899.", "addressee": "Sr. D. S, Foujita, | Tokyo.", "summary": "Impresos y revistas para Foujita.—El abandono de Tarlak, un plan estratégico.—Esperamos la determinación del Congreso americano.— Nuestra táctica es causar bajas á los enemigos y coparlos en pequeñas porciones. —La guerra recrudecerá si McKinley es reelegido.—Nuestro Pueblo jura no dejarse ya esclavizar.—200 marinos del “Oregon” copados por el General Tinio.—El General Lawton, desaparecido.—Batalla cerca de Malacañang, residencia del General Otís", "images": "page_495.jpg | page_496.jpg | page_497.jpg", "pages": "455 | 456 | 457", "flags": "", "dest": "Tokyo", "dest_kind": "printed", "dest_basis": "printed in addressee block: \"Tokyo\"", "olat": 22.2819, "olon": 114.158, "dlat": 35.6895, "dlon": 139.6917}, {"n": 233, "id": "ponce-233", "date": "1899-12-21", "sender": "Mariano Ponce", "signed": "M. Ponce", "origin": "Hong Kong", "origin_basis": "place/date line", "part": "PONCE CON LICENCIA, EN HONGKONG", "recipient": "Fernando Blumentritt", "recipient_printed": "Blumentritt", "dateline": "2 Lower Castle Terrace, Hongkong, 637 Miyokojí Yama, Kitagata, Yokohama, Diciembre 21, 1899.", "addressee": "Sr. D. F. Blumentritt.", "summary": "La opinión europea á favor nuestro.—La muerte del Gral. Lawton en San Mateo influirá en el ánimo del pueblo americano.—Sin noticias del Gral. Wheeler y su tropa.—Siguen con la táctica de robos, saqueos y asaltos en Manila y pueblos tomados.— Compañía mercantil negociando con los frutos de la rapiña.—Violaciones y asesinatos. —La sentida muerte del pintor Luna", "images": "page_497.jpg | page_498.jpg | page_499.jpg", "pages": "457 | 458 | 459", "flags": "", "dest": "Leitmeritz (Litoměřice)", "dest_kind": "inferred", "dest_basis": "inferred from letter 225 to the same recipient (1899-11-24, 27 days apart)", "olat": 22.2819, "olon": 114.158, "dlat": 50.5335, "dlon": 14.1318}, {"n": 234, "id": "ponce-234", "date": "1900-01-05", "sender": "Mariano Ponce", "signed": "M. Ponce", "origin": "Hong Kong", "origin_basis": "inferred from book part (Ponce's residence)", "part": "PONCE CON LICENCIA, EN HONGKONG", "recipient": "Francisco Rivero", "recipient_printed": "Rivero", "dateline": "5 de Enero de 1900.", "addressee": "Sr. D. Francisco Rivero, | Yokohama.", "summary": "Piden a Rivero que retire su dimisión.—No hay tal decreto de destitución.—Infundado el rumor sobre el atrcpello de su hermano.—““No rehuya los sacrificios que a todos nos impone la Patria.””—El único Representante de nuestro Gobierno en el Japón", "images": "page_499.jpg | page_500.jpg | page_501.jpg | page_502.jpg", "pages": "459 | 460 | 461 | 462", "flags": "", "dest": "Yokohama", "dest_kind": "printed", "dest_basis": "printed in addressee block: \"Yokohama\"", "olat": 22.2819, "olon": 114.158, "dlat": 35.4437, "dlon": 139.638}, {"n": 235, "id": "ponce-235", "date": "1900-01-13", "sender": "Mariano Ponce", "signed": "", "origin": "Hong Kong", "origin_basis": "place/date line", "part": "PONCE CON LICENCIA, EN HONGKONG", "recipient": "Sun Yat Sen", "recipient_printed": "Sun Yat Sen", "dateline": "2 Lower Castle Terrace, Hongkong, January 13th, 1900.", "addressee": "Dr. Sun Yat Sen.", "summary": "Lamentando las presentes dificultades.—Confiemos en el futuro.—Continúe la labor, hasta el éxito final.—Aproveche toda oportunidad para llevarla á feliz término.—Recuperando pueblos ocupados por el enemigo.—En una batalla en San Mateo, fué muerto el Gral. Lawton.—Podremos sostener la guerra con nuestras “columnas volantes.*—Aguinaldo dijo: “Podrá ser que perdamos la esperanza del triunfo por falta de recursos de guerra; pero lo que nunca perderemos es la esperanza de morir luchando por nuestra Independencia”", "images": "page_502.jpg | page_503.jpg | page_504.jpg", "pages": "462 | 463 | 464", "flags": "", "dest": "Yokohama", "dest_kind": "inferred", "dest_basis": "inferred from letter 238 to the same recipient (1900-02-02, 20 days apart)", "olat": 22.2819, "olon": 114.158, "dlat": 35.4437, "dlon": 139.638}, {"n": 236, "id": "ponce-236", "date": "1900-01-25", "sender": "Mariano Ponce", "signed": "M. Ponce", "origin": "Hong Kong", "origin_basis": "place/date line", "part": "PONCE CON LICENCIA, EN HONGKONG", "recipient": "Sun Yat Sen", "recipient_printed": "Sun Yat Sen", "dateline": "Hongkong, January 25th, 1900.", "addressee": "Dr. Sun Yat Sen.", "summary": "Imposible por ahora continuar la empresa.—Sin fortuna, nada se puede hacer contra el Destino.—Después de intentar el último esfuerzo.—Esperemos mejor ocasión", "images": "page_504.jpg | page_505.jpg | page_506.jpg", "pages": "464 | 465 | 466", "flags": "", "dest": "Yokohama", "dest_kind": "inferred", "dest_basis": "inferred from letter 238 to the same recipient (1900-02-02, 8 days apart)", "olat": 22.2819, "olon": 114.158, "dlat": 35.4437, "dlon": 139.638}, {"n": 2  "origin_basis": "place/date line", "part": "PONCE DE VUELTA EN JAPÓN", "recipient": "Ifortel", "recipient_printed": "Ifortel", "dateline": "637 Miyokojí Yama, Kitagata, Yokohama, 5 de Marzo de 1900.", "addressee": "", "summary": "Con nuevas fuerzas para trabajar. —Nuestras guerrillas se portan bien.— Patrullas americanas, capturadas por los nuestros. —El municipio de Negros organizada por los americanos fué un fracaso, pues la gente del pueblo se ha sublevado.—¡A luchar hasta conseguir la Independencia!", "images": "page_515.jpg | page_516.jpg", "pages": "475", "flags": "", "dest": "", "dest_kind": "unlocated", "dest_basis": "no place printed or inferable", "olat": 35.4437, "olon": 139.638, "dlat": null, "dlon": null}]}</script>
<script>
// ===== Background map ========================================================
// Default: OpenStreetMap standard tiles. No API key needed; the
// "© OpenStreetMap contributors" credit must stay visible.
// Optional: to use the plainer CARTO style instead, paste a free key from
// https://carto.com/basemaps/apikey/ between the quotes below.
const CARTO_KEY = '';
// =============================================================================
(function(){
const DATA = JSON.parse(document.getElementById('data').textContent);
const P = DATA.places, LET = DATA.letters;
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MES = ['enero','feb.','marzo','abril','mayo','junio','julio','agosto','sept.','oct.','nov.','dic.'];
const fmtDate = s => { const [y,m,d] = s.split('-').map(Number); return `${d} ${MON[m-1]} ${y}`; };
const oKey = o => o === 'Hong Kong' ? 'hk' : 'yk';
const shiftLon = lon => lon < -30 ? lon + 360 : lon;   // put the Americas east of Asia (trans-Pacific mail)
const ll = name => [P[name].lat, shiftLon(P[name].lon)];

// ---------- months ----------
const mIdx = s => { const [y,m] = s.split('-').map(Number); return y*12 + (m-1); };
LET.forEach(l => l.m = mIdx(l.date));
const M0 = Math.min(...LET.map(l=>l.m)), M1 = Math.max(...LET.map(l=>l.m));
const NM = M1 - M0 + 1;
const mLabel = i => { const a = M0 + i; return `${MON[a%12]} ${Math.floor(a/12)}`; };

// Ponce's residence bands from the book's four parts
const PARTS = {}; LET.forEach(l => { const p = PARTS[l.part] ||= {part:l.part, a:l.m, b:l.m, origin:l.origin}; p.a = Math.min(p.a,l.m); p.b = Math.max(p.b,l.m); });
const BANDS = Object.values(PARTS).sort((x,y)=>x.a-y.a);
const BAND_NAME = {'PONCE EN HONGKONG':'Hong Kong','PONCE EN YOKOHAMA (JAPÓN)':'Yokohama','PONCE CON LICENCIA, EN HONGKONG':'Hong Kong (on leave)','PONCE DE VUELTA EN JAPÓN':'Japan'};

const S = { a:0, b:NM-1, place:null, sel:null, playing:false, timer:null };

document.getElementById('stats').textContent =
  `${LET.length} letters · ${new Set(LET.map(l=>l.recipient)).size} correspondents · ${new Set(LET.filter(l=>l.dest).map(l=>l.dest)).size} destinations`;

// ---------- map ----------
const map = L.map('map', { worldCopyJump:false, zoomSnap:0.25, minZoom:1.5, attributionControl:true }).setView([30, 100], 2);
const dark = matchMedia('(prefers-color-scheme: dark)');
let tiles;
function setTiles(){
  if (tiles) map.removeLayer(tiles);
  const isDark = (document.documentElement.dataset.theme || (dark.matches ? 'dark':'light')) === 'dark';
  const credit = ' · Data: Ponce, <i>Cartas sobre la revolución</i> (1932)';
  document.body.classList.toggle('osm-dark', !CARTO_KEY && isDark);
  if (CARTO_KEY){
    tiles = L.tileLayer(`https://{s}.basemaps.cartocdn.com/${isDark ? 'dark_nolabels' : 'light_nolabels'}/{z}/{x}/{y}{r}.png?key=${encodeURIComponent(CARTO_KEY)}`, {
      subdomains:'abcd', maxZoom:10,
      attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>' + credit
    });
  } else {
    tiles = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom:10,
      attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors' + credit
    });
  }
  tiles.addTo(map);
}
setTiles(); dark.addEventListener('change', () => { setTiles(); render(); });


// ---------- map key ----------
const KeyCtl = L.Control.extend({ options:{position:'bottomleft'}, onAdd(){
  const d = L.DomUtil.create('details','map-key');
  if (innerWidth > 800) d.open = true;
  const sq = c => `<svg viewBox="0 0 30 16" aria-hidden="true"><rect x="9" y="1" width="13" height="13" style="fill:var(${c});stroke:var(--panel);stroke-width:2"/><rect x="9" y="1" width="13" height="13" style="fill:none;stroke:var(--ink);stroke-width:.8"/></svg>`;
  const ln = (c,w,dash,o=1) => `<svg viewBox="0 0 30 16" aria-hidden="true"><path d="M2 12 Q15 2 28 10" style="fill:none;stroke:var(${c});stroke-width:${w};stroke-linecap:round;opacity:${o}" ${dash?'stroke-dasharray="4 4"':''}/></svg>`;
  d.innerHTML = `<summary>Map key</summary><ul>
    <li><svg viewBox="0 0 30 16" aria-hidden="true"><rect x="1" y="2" width="11" height="11" style="fill:var(--hk);stroke:var(--ink);stroke-width:.8"/><rect x="17" y="2" width="11" height="11" style="fill:var(--yk);stroke:var(--ink);stroke-width:.8"/></svg>
      <span><b>Ponce's base</b> <span class="act">· click: letters sent from here</span></span></li>
    <li><svg viewBox="0 0 30 16" aria-hidden="true"><circle cx="8" cy="9" r="3.5" style="fill:var(--node)"/><circle cx="21" cy="8" r="6.5" style="fill:var(--node)"/></svg>
      <span><b>Destination</b>, sized by letters <span class="act">· click: letters and recipients</span></span></li>
    <li>${ln('--hk',3)}<span><b>Route</b>, thicker = more letters <span class="act">· click: its letters</span></span></li>
    <li>${ln('--node',2,true)}<span><b>Dashed</b>: destination inferred</span></li>
    <li>${ln('--trace',1.5,false,.6)}<span><b>Grey</b>: earlier letters (trace)</span></li>
    <li>${ln('--sun',4)}<span><b>Gold</b>: letter picked in the list</span></li>
  </ul><div class="foot">Click a square or circle again to clear its filter.</div>`;
  L.DomEvent.disableClickPropagation(d); L.DomEvent.disableScrollPropagation(d);
  return d;
}});
new KeyCtl().addTo(map);
const routeLayer = L.layerGroup().addTo(map);
const nodeLayer = L.layerGroup().addTo(map);
const hiLayer = L.layerGroup().addTo(map);

function curve(a, b, bend=0.18, n=40){
  const [y1,x1]=a, [y2,x2]=b, dx=x2-x1, dy=y2-y1;
  const cx=(x1+x2)/2 - dy*bend, cy=(y1+y2)/2 + dx*bend;
  const pts=[]; for(let i=0;i<=n;i++){ const t=i/n, u=1-t; pts.push([u*u*y1+2*u*t*cy+t*t*y2, u*u*x1+2*u*t*cx+t*t*x2]); }
  return pts;
}
// fit to every place once
map.fitBounds(L.latLngBounds(Object.keys(P).map(ll)).pad(0.08));

// ---------- selection ----------
function inRange(l){ return l.m >= M0+S.a && l.m <= M0+S.b; }
function shown(l){ return l.dest && (l.dest_kind !== 'inferred' || document.getElementById('inf').checked); }
function visibleLetters(){
  return LET.filter(l => inRange(l) && (!S.place || l.dest === S.place || (S.place.startsWith('from:') && l.origin === S.place.slice(5))));
}

function render(){
  routeLayer.clearLayers(); nodeLayer.clearLayers(); hiLayer.clearLayers();
  const cur = LET.filter(inRange), trace = document.getElementById('trace').checked;
  const routes = new Map();
  const add = (l, past) => {
    const k = `${past?1:0}|${l.origin}|${l.dest}|${l.dest_kind==='inferred'?'i':'p'}`;
    (routes.get(k) || routes.set(k, {past, origin:l.origin, dest:l.dest, inf:l.dest_kind==='inferred', ls:[]}).get(k)).ls.push(l);
  };
  if (trace && S.a > 0) LET.filter(l => l.m < M0+S.a && shown(l)).forEach(l => add(l, true));
  cur.filter(shown).forEach(l => add(l, false));
  const sorted = [...routes.values()].sort((x,y)=> (y.past-x.past) || (y.ls.length-x.ls.length));
  for (const r of sorted){
    if (r.origin === r.dest) continue;
    const w = r.past ? 1 : 1.4 + Math.sqrt(r.ls.length)*1.5;
    const col = r.past ? css('--trace') : css(r.origin==='Hong Kong' ? '--hk' : '--yk');
    const line = L.polyline(curve(ll(r.origin), ll(r.dest)), {
      color:col, weight:w, opacity: r.past ? .35 : .8, dashArray: r.inf ? '5 6' : null, lineCap:'round', interactive: !r.past
    }).addTo(routeLayer);
    if (!r.past){
      line.bindTooltip(`${esc(r.origin)} → ${esc(P[r.dest].label)}: ${r.ls.length} letter${r.ls.length>1?'s':''}${r.inf?' (inferred)':''}`, {sticky:true});
      line.on('click', e => L.popup().setLatLng(e.latlng).setContent(routePopup(r)).openOn(map));
    }
  }
  // destination nodes
  const byPlace = {}; cur.filter(shown).forEach(l => (byPlace[l.dest] ||= []).push(l));
  const origins = new Set(cur.map(l=>l.origin));
  for (const [name, ls] of Object.entries(byPlace)){
    const m = L.circleMarker(ll(name), { radius: 3 + Math.sqrt(ls.length)*2.2, color:css('--panel'), weight:1.5,
      fillColor: css('--node'), fillOpacity: S.place===name ? 1 : .85 }).addTo(nodeLayer);
    m.bindTooltip(`${esc(P[name].label)} <span style="opacity:.7">${ls.length}</span>`, {permanent:true, direction:'right', offset:[6,0], className:'plabel'});
    m.on('click', () => { setPlace(S.place===name ? null : name); placePopup(name); });
  }
  // Ponce's two bases
  for (const o of ['Hong Kong','Yokohama']){
    const here = origins.has(o);
    const mk = L.marker(ll(o), { icon: L.divIcon({className:'', html:`<div class="osq ${oKey(o)} ${here?'':'away'}"></div>`, iconSize:[14,14], iconAnchor:[7,7]}), zIndexOffset:1000, keyboard:true, title:`Ponce in ${o}` }).addTo(nodeLayer);
    mk.bindTooltip(`Ponce · ${o}`, {permanent:true, direction:'left', offset:[-8,0], className:'plabel origin'});
    mk.on('click', () => setPlace(S.place===`from:${o}` ? null : `from:${o}`));
  }
  if (S.sel) highlight(S.sel, false);
  renderList(); drawTimeline();
}

function letterHTML(l){
  const dest = l.dest ? `${esc(P[l.dest].label)}` : 'destination not identified';
  return `<div class="pop"><h3>No. ${l.n} · ${fmtDate(l.date)}</h3>
    <div class="meta">To <b>${esc(l.recipient)}</b> → ${dest}<br>From ${esc(l.origin)}${l.signed?` · signed “${esc(l.signed)}”`:''}</div>
    ${l.summary?`<div class="sum">${esc(l.summary)}</div>`:''}
    <dl>
      <dt>Dateline</dt><dd>${esc(l.dateline)}</dd>
      ${l.addressee?`<dt>Addressee</dt><dd>${esc(l.addressee).replace(/\n/g,' / ')}</dd>`:''}
      <dt>Destination</dt><dd>${esc(l.dest_basis)}</dd>
      <dt>Printed pp.</dt><dd>${esc(l.pages)} · ${esc(l.images)}</dd>
      ${l.flags?`<dt>Review</dt><dd>${esc(l.flags)}</dd>`:''}
    </dl></div>`;
}
function routePopup(r){
  return `<div class="pop"><h3>${esc(r.origin)} → ${esc(P[r.dest].label)}</h3>
    <div class="meta">${r.ls.length} letter${r.ls.length>1?'s':''} in this period${r.inf?' · destination inferred':''}</div>
    <ul>${r.ls.sort((a,b)=>a.date<b.date?-1:1).map(l=>`<li><button class="lk" data-n="${l.n}">No. ${l.n}</button>, ${fmtDate(l.date)}, to ${esc(l.recipient)}</li>`).join('')}</ul></div>`;
}
function placePopup(name){
  const ls = LET.filter(l => inRange(l) && l.dest===name && shown(l));
  const who = {}; ls.forEach(l => who[l.recipient]=(who[l.recipient]||0)+1);
  L.popup().setLatLng(ll(name)).setContent(`<div class="pop"><h3>${esc(P[name].label)}</h3>
    <div class="meta">${ls.length} letter${ls.length>1?'s':''} received in this period</div>
    <ul>${Object.entries(who).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<li>${esc(k)} <span style="opacity:.7">(${v})</span></li>`).join('')}</ul></div>`).openOn(map);
}
map.on('popupopen', e => e.popup.getElement().querySelectorAll('.lk').forEach(b => b.addEventListener('click', () => selectLetter(+b.dataset.n, true))));

function highlight(l, open){
  hiLayer.clearLayers();
  if (l.dest && l.origin !== l.dest){
    L.polyline(curve(ll(l.origin), ll(l.dest)), {color:css('--sun'), weight:5, opacity:.95, dashArray: l.dest_kind==='inferred'?'5 6':null, interactive:false}).addTo(hiLayer);
  }
  if (open) L.popup({maxWidth:340}).setLatLng(l.dest ? ll(l.dest) : ll(l.origin)).setContent(letterHTML(l)).openOn(map);
}
function selectLetter(n, open){
  const l = LET.find(x=>x.n===n); S.sel = l; highlight(l, open);
  document.querySelectorAll('#list li').forEach(li => li.classList.toggle('on', +li.dataset.n===n));
  const li = document.querySelector(`#list li[data-n="${n}"]`); if (li) li.scrollIntoView({block:'nearest'});
}

// ---------- register ----------
function renderList(){
  const ls = visibleLetters().sort((a,b)=> a.date<b.date?-1:a.date>b.date?1:a.n-b.n);
  document.getElementById('count').textContent = `${ls.length} letter${ls.length===1?'':'s'}`;
  const f = document.getElementById('filter');
  f.innerHTML = S.place ? `<span class="chip">${S.place.startsWith('from:')?'sent from '+esc(S.place.slice(5)):'to '+esc(P[S.place].label)}<button aria-label="Clear place filter">×</button></span>` : '';
  if (S.place) f.querySelector('button').onclick = () => setPlace(null);
  const ul = document.getElementById('list');
  ul.innerHTML = ls.length ? ls.map(l => `<li data-n="${l.n}" class="${S.sel&&S.sel.n===l.n?'on':''}"><button>
      <span class="no">${l.n}<small>${l.date.slice(0,4)}</small></span>
      <span class="who">${esc(l.recipient)}</span>
      <span class="where"><span class="o ${oKey(l.origin)}">${esc(l.origin)}</span> → ${l.dest?esc(P[l.dest].label):'place unknown'}${l.dest_kind==='inferred'?'<span class="tag">inferred</span>':''}${l.dest_kind==='unlocated'?'<span class="tag">unplaced</span>':''} · ${fmtDate(l.date)}</span>
      ${l.summary?`<span class="sum">${esc(l.summary)}</span>`:'<span></span>'}
    </button></li>`).join('') : '<li class="empty">No letters in this period.</li>';
  ul.querySelectorAll('li[data-n] button').forEach(b => b.onclick = () => selectLetter(+b.parentElement.dataset.n, true));
}
function setPlace(p){ S.place = p; renderList(); render(); }

// ---------- chronotope timeline ----------
const svg = document.getElementById('tl'), NS='http://www.w3.org/2000/svg';
const counts = Array.from({length:NM}, () => ({hk:0, yk:0, un:0}));
LET.forEach(l => { const c = counts[l.m-M0]; if (!l.dest) c.un++; else c[oKey(l.origin)]++; });
const maxC = Math.max(...counts.map(c=>c.hk+c.yk+c.un));
let geo = null;
function el(t, a, parent=svg){ const e=document.createElementNS(NS,t); for(const k in a) e.setAttribute(k,a[k]); parent.appendChild(e); return e; }
function drawTimeline(){
  const W = svg.clientWidth || 800, H = 118, padL = 4, padR = 4, top = 22, base = 92;
  const bw = (W-padL-padR)/NM; geo = {padL, bw};
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`); svg.innerHTML='';
  // residence band
  BANDS.forEach(b => {
    const x = padL + (b.a-M0)*bw, w = (b.b-b.a+1)*bw;
    el('rect',{x:x+.5,y:2,width:Math.max(w-1,1),height:14,fill:css(b.origin==='Hong Kong'?'--hk':'--yk'),opacity:.16});
    const t = el('text',{x:x+4,y:13,class:'bandlab',fill:css(b.origin==='Hong Kong'?'--hk':'--yk')}); t.textContent = BAND_NAME[b.part]||b.part;
    if (t.getComputedTextLength() > w-6) t.textContent = w > 40 ? (b.origin==='Hong Kong'?'HK':'JP') : '';
  });
  // selection window
  el('rect',{x:padL+S.a*bw, y:top-4, width:(S.b-S.a+1)*bw, height:base-top+6, fill:css('--sun'), opacity:.16});
  // bars
  const sc = (base-top)/maxC;
  counts.forEach((c,i) => {
    const x = padL + i*bw + bw*.14, w = bw*.72, on = i>=S.a && i<=S.b; let y = base;
    for (const [k,col] of [['hk','--hk'],['yk','--yk'],['un','--trace']]){
      if (!c[k]) continue; const h = c[k]*sc; y -= h;
      el('rect',{x, y, width:w, height:h, fill:css(col), opacity:on?1:.3});
    }
  });
  el('line',{x1:padL,x2:W-padR,y1:base+.5,y2:base+.5,stroke:css('--rule')});
  // month & year ticks
  for (let i=0;i<NM;i++){
    const a = M0+i, mo = a%12, x = padL + i*bw;
    if (mo===0 || i===0){ el('line',{x1:x,x2:x,y1:base,y2:base+16,stroke:css('--muted')}); el('text',{x:x+3,y:base+26,class:'yr'}).textContent = Math.floor(a/12); }
    if (bw > 22 || (bw > 11 && mo%3===0)) el('text',{x:x+bw/2,y:base+12,'text-anchor':'middle'}).textContent = MON[mo][0];
  }
  el('text',{x:W-padR,y:top+6,'text-anchor':'end'}).textContent = `max ${maxC}/month`;
  document.getElementById('range').textContent = (S.a===0 && S.b===NM-1) ? 'May 1897 – Mar 1900 (all)' : (S.a===S.b ? mLabel(S.a) : `${mLabel(S.a)} – ${mLabel(S.b)}`);
}
// drag to select
let drag = null;
const monthAt = e => { const r = svg.getBoundingClientRect(); const x = (e.clientX - r.left) * (svg.viewBox.baseVal.width / r.width); return Math.max(0, Math.min(NM-1, Math.floor((x-geo.padL)/geo.bw))); };
svg.addEventListener('pointerdown', e => { stop(); drag = monthAt(e); svg.setPointerCapture(e.pointerId); S.a = S.b = drag; drawTimeline(); });
svg.addEventListener('pointermove', e => { if (drag===null) return; const m = monthAt(e); S.a = Math.min(drag,m); S.b = Math.max(drag,m); drawTimeline(); });
svg.addEventListener('pointerup', () => { if (drag===null) return; drag = null; render(); });

// ---------- play ----------
const playBtn = document.getElementById('play');
function stop(){ S.playing=false; clearInterval(S.timer); playBtn.setAttribute('aria-pressed','false'); playBtn.textContent='▶ Play'; }
function step(){
  const w = +document.getElementById('win').value;
  if (S.b >= NM-1){ stop(); return; }
  S.b = Math.min(NM-1, S.b+1); S.a = Math.max(0, S.b-w+1); render();
}
playBtn.onclick = () => {
  if (S.playing){ stop(); return; }
  const w = +document.getElementById('win').value;
  if (S.b >= NM-1 || (S.a===0 && S.b===NM-1)){ S.a = 0; S.b = w-1; render(); }
  S.playing = true; playBtn.setAttribute('aria-pressed','true'); playBtn.textContent='❚❚ Pause';
  S.timer = setInterval(step, matchMedia('(prefers-reduced-motion: reduce)').matches ? 2000 : 1100);
};
document.getElementById('all').onclick = () => { stop(); S.a=0; S.b=NM-1; render(); };
document.getElementById('trace').onchange = render;
document.getElementById('inf').onchange = render;
document.getElementById('win').onchange = () => { if (!(S.a===0&&S.b===NM-1)){ const w=+document.getElementById('win').value; S.a=Math.max(0,S.b-w+1); render(); } };
addEventListener('resize', drawTimeline);
render();
})();
</script>
</body>
</html>
