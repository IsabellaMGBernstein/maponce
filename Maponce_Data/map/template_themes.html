<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mapping Maponce · Themes</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&family=Archivo+Narrow:wght@400;500;600&display=swap">
<style>
/* Layout: one-screen instrument. Header strip, map + theme panel side by side. */
:root{
  --paper:#eef1f3; --panel:#f8f9fa; --ink:#1c2430; --muted:#5b6675; --rule:#cfd5dc;
  --hk:#b3262e;      /* letters sent from Hong Kong  */
  --yk:#1f4f9a;      /* letters sent from Yokohama   */
  --sun:#c8961a;     /* selection highlight          */
  --sel:#1f8a4c;     /* clicked route                */
  --star:#f5c518; --star-edge:#6b5300;   /* destination stars */
  --r1:#2a78d6; --r2:#eb6834; --r3:#1baf7a; --other:#9c9488;   /* correspondents */
  --y1:#c3773e; --y2:#a65c20; --y3:#854408; --y4:#633002;      /* years 1897-1900, light to dark (sepia; same on every map) */
  --k1:#502684; --k2:#6d41a9; --k3:#8864c0; --k4:#a68bd5; --rest:#d8d4cc;   /* ranking: 1st darkest; everyone else */
  --node:#2b3440; --trace:#8f99a6; --band:#e2e6ea;
  --ocean:#cddce6; --ocean-ink:#55768d; --land:#f6f3ec; --border:#a7adb5; --coast:#8a9aa8;
  --display:"Old Standard TT", "Iowan Old Style", Georgia, serif;
  --ui:"Archivo Narrow", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#12161c; --panel:#181d24; --ink:#e4e8ec; --muted:#98a3b0; --rule:#2c343e;
  --hk:#e0545b; --yk:#6f9be0; --sun:#e5b43c; --sel:#4cc47e; --star:#ffd23f; --star-edge:#2a2100; --r1:#3987e5; --r2:#d95926; --r3:#199e70; --other:#8a8478; --y1:#a5612e; --y2:#ca7d44; --y3:#e3a072; --y4:#f6c6a6; --k1:#d2bff8; --k2:#b699eb; --k3:#9b74d9; --k4:#7e53bc; --rest:#4a4f57; --node:#d5dbe1; --trace:#5d6774; --band:#232a33;
  --ocean:#0b1620; --ocean-ink:#6d90a8; --land:#2a313a; --border:#56606c; --coast:#48627a; color-scheme:dark } }
:root[data-theme="dark"]{
  --paper:#12161c; --panel:#181d24; --ink:#e4e8ec; --muted:#98a3b0; --rule:#2c343e;
  --hk:#e0545b; --yk:#6f9be0; --sun:#e5b43c; --sel:#4cc47e; --star:#ffd23f; --star-edge:#2a2100; --r1:#3987e5; --r2:#d95926; --r3:#199e70; --other:#8a8478; --y1:#a5612e; --y2:#ca7d44; --y3:#e3a072; --y4:#f6c6a6; --k1:#d2bff8; --k2:#b699eb; --k3:#9b74d9; --k4:#7e53bc; --rest:#4a4f57; --node:#d5dbe1; --trace:#5d6774; --band:#232a33;
  --ocean:#0b1620; --ocean-ink:#6d90a8; --land:#2a313a; --border:#56606c; --coast:#48627a; color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font:15px/1.4 var(--ui);display:flex;flex-direction:column;overflow:hidden}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sun);outline-offset:2px}

header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 22px;padding:12px 18px 10px;border-bottom:1px solid var(--rule)}
h1{font:700 22px/1.1 var(--display);margin:0;text-wrap:balance}
h1 em{font-weight:400}
.sub{color:var(--muted);font-size:14px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;margin-left:auto;font-size:13px;color:var(--muted);align-items:center}
.key{display:inline-flex;align-items:center;gap:6px}
.sw{width:22px;height:0;border-top:3px solid currentColor;display:inline-block}
.sw.dash{border-top-style:dashed}

main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 360px}
#map{min-height:0;background:var(--ocean)}
aside{min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--panel);border-left:1px solid var(--rule)}
.reg-head{padding:12px 16px 8px;border-bottom:1px solid var(--rule);display:flex;flex-direction:column;gap:6px}
.reg-head h2{font:700 17px/1.2 var(--display);margin:0}
.reg-title{display:flex;align-items:center;justify-content:space-between;gap:8px}
.reg-toggle{flex:none;width:26px;height:26px;display:grid;place-items:center;border:1px solid var(--rule);border-radius:4px;background:var(--paper);color:var(--muted);font:600 16px/1 var(--ui);cursor:pointer;padding:0}
.reg-toggle:hover{color:var(--ink);border-color:var(--muted)}
/* Minimized: the list shrinks to a thin strip at the right edge and the map takes the space */
main.reg-min{grid-template-columns:minmax(0,1fr) 44px}
main.reg-min .reg-head{border-bottom:0;padding:10px 0;align-items:center;flex:1}
main.reg-min .reg-title{flex-direction:column-reverse;gap:12px}
main.reg-min .reg-head h2{writing-mode:vertical-rl;font-size:15px;white-space:nowrap}
main.reg-min .reg-meta, main.reg-min .reg-head label, main.reg-min .letters{display:none}
.reg-meta{color:var(--muted);font-size:13px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--band);border:1px solid var(--rule);border-radius:999px;padding:1px 4px 1px 10px;font-size:13px;color:var(--ink)}
.reg-head label{display:inline-flex;gap:6px;align-items:center;color:var(--muted);font-size:13px;cursor:pointer}
.chip button{border:0;background:none;cursor:pointer;padding:0 6px;font-size:15px;line-height:1;color:var(--muted)}
.letters{list-style:none;margin:0;padding:0;overflow-y:auto;flex:1}
.letters li{border-bottom:1px solid var(--rule)}
.letters button{all:unset;display:grid;grid-template-columns:44px 1fr;gap:2px 10px;padding:9px 16px;cursor:pointer;width:100%;box-sizing:border-box}
.letters button:hover{background:var(--band)}
.letters button:focus-visible{outline:2px solid var(--sun);outline-offset:-2px}
.letters li.on button{background:var(--band);box-shadow:inset 3px 0 0 var(--sun)}
.no{font:700 15px/1.2 var(--display);grid-row:span 3;padding-top:1px}
.no small{display:block;font:500 11px var(--ui);color:var(--muted);letter-spacing:.04em;font-variant-numeric:tabular-nums}
.who{font-weight:600}
.where{font-size:13px;color:var(--muted)}
.where .o{font-weight:600}
.o.hk{color:var(--hk)} .o.yk{color:var(--yk)}
.tag{font-size:11px;letter-spacing:.05em;text-transform:uppercase;border:1px solid var(--rule);border-radius:3px;padding:0 4px;margin-left:4px;color:var(--muted)}
.sum{font:italic 14px/1.35 var(--display);color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.empty{padding:20px 16px;color:var(--muted)}

/* Map key (bottom-left control) */
.map-key{background:var(--panel);color:var(--ink);border:1px solid var(--rule);border-radius:6px;box-shadow:0 1px 8px rgb(0 0 0 / .18);width:250px;font:12px/1.3 var(--ui);margin-bottom:14px!important}
.map-key summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;padding:7px 10px;font:700 14px var(--display)}
.map-key summary::-webkit-details-marker{display:none}
.map-key summary::after{content:"–";font:600 15px var(--ui);color:var(--muted)}
.map-key:not([open]) summary::after{content:"+"}
.map-key ul{list-style:none;margin:0;padding:2px 10px 8px;display:grid;gap:5px;border-top:1px solid var(--rule);padding-top:8px}
.map-key li{display:grid;grid-template-columns:30px 1fr;gap:8px;align-items:center}
.map-key svg{width:30px;height:16px;display:block;margin-top:1px}
.map-key b{font-weight:600}
.map-key .act{color:var(--muted)}
.map-key .foot{padding:6px 10px 8px;border-top:1px solid var(--rule);color:var(--muted)}
/* Leaflet skinning */
.leaflet-container{font:13px/1.35 var(--ui);background:var(--ocean)}
/* Continent and ocean names */
.geo{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;pointer-events:none;user-select:none}
.geo.continent{font:600 12px var(--ui);letter-spacing:.24em;text-transform:uppercase;color:var(--muted);opacity:.8}
.geo.ocean{font:italic 15px var(--display);letter-spacing:.1em;color:var(--ocean-ink)}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--panel);color:var(--ink);border-radius:6px;box-shadow:0 2px 14px rgb(0 0 0 / .25)}
.leaflet-popup-content{margin:12px 14px;max-height:340px;overflow:auto}
.leaflet-container a.leaflet-popup-close-button{color:var(--muted)}
.leaflet-bar a{background:var(--panel);color:var(--ink);border-bottom-color:var(--rule)}
.leaflet-control-attribution{background:color-mix(in srgb,var(--panel) 80%,transparent)!important;color:var(--muted)}
.leaflet-control-attribution a{color:var(--muted)}
.plabel{background:none;border:0;box-shadow:none;padding:0;color:var(--ink);font:600 12px var(--ui);text-shadow:0 0 3px var(--paper),0 0 3px var(--paper),0 0 2px var(--paper)}
.plabel::before{display:none}
.plabel.origin{font:700 14px var(--display)}
/* Destination stars */
.dest-star svg{display:block;overflow:visible}
.dest-star polygon{fill:var(--star);stroke:var(--star-edge);stroke-width:1px;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.dest-star.on polygon{stroke-width:2.5px}
.dest-star:focus-visible{outline:2px solid var(--sun);outline-offset:2px;border-radius:50%}
/* Ponce's bases: red triangle = Hong Kong, blue triangle = Yokohama */
.base-tri svg{display:block;overflow:visible}
.base-tri .halo{fill:none;stroke:var(--panel);stroke-width:4px;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.base-tri .tri{stroke:var(--ink);stroke-width:1px;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.base-tri.hk .tri{fill:var(--hk)} .base-tri.yk .tri{fill:var(--yk)}
.base-tri.away{opacity:.35}
.base-tri:focus-visible{outline:2px solid var(--sun);outline-offset:2px}
.pop h3{font:700 16px/1.2 var(--display);margin:0 0 4px}
.pop .meta{color:var(--muted);margin-bottom:6px}
.pop .sum{-webkit-line-clamp:unset;display:block;margin:6px 0;color:var(--ink)}
.pop dl{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:6px 0 0;font-size:12px}
.pop dt{color:var(--muted)} .pop dd{margin:0}
.pop ul{margin:4px 0 0;padding-left:16px}
.pop li{margin:2px 0}
.pop .lk{all:unset;cursor:pointer;text-decoration:underline;text-underline-offset:2px}

@media (max-width:800px){
  body{overflow:auto;height:auto}
  main{grid-template-columns:1fr;flex:none}
  #map{height:58vh}
  aside{border-left:0;border-top:1px solid var(--rule)}
  .letters{max-height:none;overflow:visible}
  main.reg-min{grid-template-columns:1fr}
  main.reg-min .reg-head{padding:12px 16px;align-items:stretch}
  main.reg-min .reg-title{flex-direction:row}
  main.reg-min .reg-head h2{writing-mode:horizontal-tb;font-size:17px}
  .legend{margin-left:0}
  h1{font-size:19px}
}
@media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important} }

/* Switch between the map pages */
.views{display:inline-flex;gap:2px;border:1px solid var(--rule);border-radius:6px;padding:2px;align-self:center}
.views a{padding:2px 10px;border-radius:4px;color:var(--muted);text-decoration:none;font-size:13px;font-weight:600}
.views a:hover{color:var(--ink);background:var(--band)}
.views a[aria-current="page"]{background:var(--ink);color:var(--paper)}
.legend .sw{color:var(--c)}
/* Correspondent panel */
.panel-body{overflow-y:auto;flex:1;min-height:0}
#search{width:100%;padding:5px 8px;border:1px solid var(--rule);border-radius:4px;background:var(--paper);font-size:14px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.who-list{list-style:none;margin:0;padding:0}
.who-list li{border-bottom:1px solid var(--rule);display:grid;grid-template-columns:auto 1fr;align-items:stretch}
.who-list .row{all:unset;box-sizing:border-box;width:100%;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:1px 10px;align-items:center;padding:8px 16px 8px 4px}
.who-list .row:hover{background:var(--band)}
.who-list .row:focus-visible{outline:2px solid var(--sun);outline-offset:-2px}
/* the colour button: a filled dot when the correspondent has a colour, an empty ring when not */
.paint{all:unset;box-sizing:border-box;width:40px;display:grid;place-items:center;cursor:pointer}
.paint .dot{width:12px;height:12px;transition:transform .1s}
.paint[aria-pressed="false"] .dot{background:transparent;box-shadow:inset 0 0 0 1.5px var(--muted)}
.paint:hover .dot{transform:scale(1.3)}
.paint:focus-visible{outline:2px solid var(--sun);outline-offset:-4px;border-radius:50%}
.paint:disabled{cursor:not-allowed;opacity:.35}
.paint:disabled:hover .dot{transform:none}
.paint-wide{border:1px solid var(--rule);background:var(--paper);border-radius:4px;padding:3px 10px;cursor:pointer;font-size:13px;font-weight:600;margin:0 0 10px;display:inline-flex;gap:8px;align-items:center}
.paint-wide:hover{border-color:var(--muted)}
.paint-wide:disabled{cursor:not-allowed;opacity:.55}
.slot .x{all:unset;cursor:pointer;color:var(--muted);font-size:15px;line-height:1;padding:0 2px}
.slot .x:hover{color:var(--ink)} .slot .x:focus-visible{outline:2px solid var(--sun)}
.slot.free{font-style:italic}
.slot.free .sw{opacity:.35}
.legend .reset{border:1px solid var(--rule);background:var(--paper);border-radius:4px;padding:1px 8px;cursor:pointer;font-size:12px;color:var(--muted)}
.legend .reset:hover{color:var(--ink);border-color:var(--muted)}
.who-list .nm{font-weight:600}
.who-list .n{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.who-list .places{grid-column:1 / -1;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.profile{padding:12px 16px 4px}
.back{all:unset;cursor:pointer;color:var(--muted);font-size:13px;font-weight:600}
.back:hover{color:var(--ink)} .back:focus-visible{outline:2px solid var(--sun);outline-offset:2px}
.profile h3{font:700 19px/1.2 var(--display);margin:10px 0 8px;display:flex;align-items:center;gap:8px}
.bio{font:15px/1.45 var(--display);margin:0 0 12px}
.bio.pending{color:var(--muted);font-style:italic}
.facts{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0 0 14px;font-size:13px}
.facts dt{color:var(--muted)} .facts dd{margin:0}
.profile h4{font:600 12px var(--ui);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
/* Letters per year: pie with a legend of counts beside it */
.yearpie{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.yearpie svg{width:116px;height:116px;flex:none;overflow:visible}
.yearpie path{stroke:var(--panel);stroke-width:2px;stroke-linejoin:round}
.yearpie path:hover{opacity:.85}
.ylegend{display:grid;grid-template-columns:12px auto auto auto;gap:5px 10px;align-items:center;font-size:13px;font-variant-numeric:tabular-nums}
.ylegend .sq{width:12px;height:12px;border-radius:3px;background:var(--c)}
.ylegend .v{text-align:right;font-weight:600}
.ylegend .pc{color:var(--muted);text-align:right}
.ylegend .none{opacity:.45}
.one-year{font-size:13px;margin:0}
/* Ranking box (top right of the map): correspondents by letters received */
/* bottom-left corner: Map Key and this box side by side, bottoms aligned (key first) */
.leaflet-bottom.leaflet-left{display:flex;flex-direction:row-reverse;justify-content:flex-end;align-items:flex-end;flex-wrap:wrap}
.rank-box{width:272px}
.rank-top{display:flex;gap:12px;align-items:center;padding:10px;border-top:1px solid var(--rule)}
.rank-top svg{width:92px;height:92px;flex:none;overflow:visible}
.rank-top path{stroke:var(--panel);stroke-width:2px;stroke-linejoin:round}
.rank-top path[data-r]{cursor:pointer}
.rank-top path[data-r]:hover{opacity:.85}
.rank-legend{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:4px 6px;align-items:center;min-width:0}
.rank-legend .sq{width:10px;height:10px;border-radius:2px;background:var(--c)}
.rank-legend .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank-legend button.nm{all:unset;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank-legend button.nm:hover{text-decoration:underline}
.rank-legend .v{font-variant-numeric:tabular-nums;color:var(--muted);text-align:right}
.rank-head{padding:6px 10px 2px;border-top:1px solid var(--rule);color:var(--muted);font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.rank-list{list-style:none;margin:0;padding:0 0 6px;max-height:210px;overflow-y:auto}
.rank-list li{display:block}   /* not the map key's two-column rows */
.rank-list button{all:unset;box-sizing:border-box;width:100%;cursor:pointer;display:grid;grid-template-columns:2.2em minmax(0,1fr) auto 2.6em;gap:6px;padding:3px 10px;align-items:baseline;font-variant-numeric:tabular-nums}
.rank-list button:hover{background:var(--band)}
.rank-list button:focus-visible{outline:2px solid var(--sun);outline-offset:-2px}
.rank-list li.on button{background:var(--band);box-shadow:inset 3px 0 0 var(--sel)}
.rank-list .rk{color:var(--muted);text-align:right}
.rank-list .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank-list .pc{color:var(--muted);text-align:right}
.pop .pick{all:unset;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
main.reg-min #search, main.reg-min .panel-body{display:none}
@media (max-width:800px){ .panel-body{overflow:visible} }

/* Themes map: letters with their transcripts */
.note{margin:12px 16px;padding:10px 12px;border:1px dashed var(--rule);border-radius:6px;font-size:13px;color:var(--muted)}
.note code{font-size:12px}
.hint-small{font-size:12px;color:var(--muted);margin:-2px 0 6px}
.tletters{list-style:none;margin:0;padding:0}
.tletters li{border-bottom:1px solid var(--rule)}
.tletters summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:44px 1fr;gap:2px 10px;padding:9px 16px}
.tletters summary::-webkit-details-marker{display:none}
.tletters summary:hover, .tletters details[open] summary{background:var(--band)}
.tletters summary:focus-visible{outline:2px solid var(--sun);outline-offset:-2px}
.tletters .no{grid-row:span 2}
.tx{padding:6px 16px 14px 70px}
.tx .sum{-webkit-line-clamp:unset;display:block;margin:0 0 6px}
.tx .tags{font-size:12px;color:var(--muted);margin:0 0 6px}
.tx .text{white-space:pre-wrap;font:14px/1.55 var(--display);margin:6px 0 10px}
.show{border:1px solid var(--rule);background:var(--paper);border-radius:4px;padding:2px 10px;cursor:pointer;font-size:12px;font-weight:600}
.show:hover{border-color:var(--muted)}
@media (max-width:800px){ .tx{padding-left:16px} }
</style>
</head>
<body>
<header>
  <h1>Cartas de Mariano Ponce <em>1897–1900</em></h1>
  __NAV__
  <span class="sub" id="stats"></span>
  <div class="legend" id="legend" aria-label="Legend"></div>
</header>

<main>
  <div id="map" role="region" aria-label="Map of letters by theme"></div>
  <aside>
    <div class="reg-head">
      <div class="reg-title">
        <h2 id="panelTitle">Themes</h2>
        <button class="reg-toggle" id="regToggle" aria-expanded="true" aria-controls="panel" title="Minimize the list of themes" aria-label="Minimize the list of themes">–</button>
      </div>
      <div class="reg-meta" id="panelMeta"></div>
      <label><input type="checkbox" id="inf" checked> Include inferred destinations</label>
    </div>
    <div class="panel-body" id="panel"></div>
  </aside>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script id="world" type="application/json">__WORLD__</script>
<script id="data" type="application/json">__DATA__</script>
<script id="themes" type="application/json">__THEMES__</script>
<script id="texts" type="application/json">__TEXTS__</script>
<script>
// ===== Background map ========================================================
// A flat (two-dimensional) map of land, oceans and present-day country borders
// from Natural Earth (1:50m, via world-atlas: map/countries-50m.json), drawn in
// the page itself. No map tiles, no API key. The borders are modern, not 1897-1900.
// =============================================================================
(function(){
const DATA = JSON.parse(document.getElementById('data').textContent);
const P = DATA.places, LET = DATA.letters;
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MES = ['enero','feb.','marzo','abril','mayo','junio','julio','agosto','sept.','oct.','nov.','dic.'];
const fmtDate = s => { const [y,m,d] = s.split('-').map(Number); return `${d} ${MON[m-1]} ${y}`; };
const oKey = o => o === 'Hong Kong' ? 'hk' : 'yk';
const shiftLon = lon => lon < -30 ? lon + 360 : lon;   // put the Americas east of Asia (trans-Pacific mail)
const ll = name => [P[name].lat, shiftLon(P[name].lon)];

const S = { theme:null, sel:null };

document.getElementById('stats').textContent =
  `${LET.length} letters · ${new Set(LET.map(l=>l.recipient)).size} correspondents · ${new Set(LET.filter(l=>l.dest).map(l=>l.dest)).size} destinations`;

// ---------- map ----------
// The map scrolls sideways across exactly one world, from 31.5°W eastward to 31.5°W again, so the
// routes can run east across the Pacific to the Americas. The edges fall in the mid-Atlantic, which
// keeps the Azores, Iceland and Cabo Verde whole; only Greenland is split between the two edges.
const WEST = -31.5, EAST = WEST + 360;
// zoomSnap:0 lets the map zoom to any level, so it can fit the world exactly to the window
const map = L.map('map', { worldCopyJump:false, zoomSnap:0, maxZoom:8, attributionControl:true,
  maxBounds:[[-85, WEST], [85, EAST]], maxBoundsViscosity:1 });
// never zoom out so far that the map is narrower than the window (which would show past the edges)
const fitMinZoom = () => map.setMinZoom(Math.log2(map.getSize().x / 256) + 0.001);
fitMinZoom(); map.on('resize', fitMinZoom);
map.attributionControl.addAttribution('Borders: <a href="https://www.naturalearthdata.com">Natural Earth</a> · Data: Ponce, <i>Cartas sobre la revolución</i> (1932)');
const dark = matchMedia('(prefers-color-scheme: dark)');

const WORLD = JSON.parse(document.getElementById('world').textContent);
// The border data is made for a globe. On a flat map, Russia and Fiji (which cross the
// 180° meridian) and Antarctica (which surrounds the South Pole) need their outlines repaired.
function fixRing(ring){
  const out = [ring[0].slice()];
  for (const [x0, y] of ring.slice(1)){            // keep longitudes continuous: no jump from 180° to -180°
    const prev = out[out.length-1][0]; let x = x0;
    while (x - prev > 180) x -= 360;
    while (x - prev < -180) x += 360;
    out.push([x, y]);
  }
  const first = out[0][0], last = out[out.length-1][0];
  if (Math.abs(last - first) > 180) out.push([last, -90], [first, -90]);   // Antarctica: close the ring at the South Pole
  return out;
}
const isPoleSliver = ring => ring.every(([, y]) => y <= -89.9);
const fixPolygon = rings => rings.filter(r => !isPoleSliver(r)).map(fixRing);
const COUNTRIES = topojson.feature(WORLD, WORLD.objects.countries);
for (const f of COUNTRIES.features){
  const g = f.geometry; if (!g) continue;
  if (g.type === 'Polygon') g.coordinates = fixPolygon(g.coordinates);
  if (g.type === 'MultiPolygon') g.coordinates = g.coordinates.map(fixPolygon).filter(r => r.length);
}
const BORDERS = topojson.mesh(WORLD, WORLD.objects.countries, (a, b) => a !== b);   // shared borders only
// Coastlines, minus the cuts along the 180° meridian and the South Pole, which are not real coast
const onCut = ([x, y]) => Math.abs(x) >= 179.99 || y <= -89.9;
const isCut = (a, b) => Math.abs(a[0] - b[0]) > 180 || (onCut(a) && onCut(b));
const COAST = { type:'MultiLineString', coordinates: topojson.mesh(WORLD, WORLD.objects.land).coordinates.flatMap(line => {
  const out = []; let cur = [line[0]];
  for (const pt of line.slice(1)){
    if (isCut(cur[cur.length-1], pt)){ if (cur.length > 1) out.push(cur); cur = [pt]; }
    else cur.push(pt);
  }
  if (cur.length > 1) out.push(cur);
  return out;
}) };
const GEO_LABELS = [
  ['continent','North America', 47,-102], ['continent','South America',-14,-58], ['continent','Europe',  57, 28],
  ['continent','Africa',          6,  20], ['continent','Asia',          48, 92], ['continent','Australia',-24,134],
  ['continent','Antarctica',    -75, 100],
  ['ocean','Pacific Ocean',  12,-152], ['ocean','Pacific Ocean', -32,-120], ['ocean','Atlantic Ocean', 22,-52],
  ['ocean','Indian Ocean',  -22,  78], ['ocean','Arctic Ocean',   75,172],
  ['ocean','Southern Ocean',-58, 100],
];
map.createPane('base').style.zIndex = 200;
const labelPane = map.createPane('geoLabels'); labelPane.style.zIndex = 350; labelPane.style.pointerEvents = 'none';
const baseRenderer = L.canvas({ pane:'base', padding:0.5 });
const baseLayer = L.layerGroup().addTo(map);
function drawBase(){
  baseLayer.clearLayers();
  // two copies of the world (the second shifted 360° east) fill the span from WEST to EAST
  for (const off of [0, 360]){
    const opt = { pane:'base', renderer:baseRenderer, interactive:false, coordsToLatLng: c => L.latLng(c[1], c[0] + off) };
    L.geoJSON(COUNTRIES, { ...opt, style:{ stroke:false, fillColor:css('--land'), fillOpacity:1 } }).addTo(baseLayer);
    L.geoJSON(COAST,     { ...opt, style:{ color:css('--coast'),  weight:0.8, fill:false } }).addTo(baseLayer);
    L.geoJSON(BORDERS,   { ...opt, style:{ color:css('--border'), weight:0.7, fill:false } }).addTo(baseLayer);
    for (const [kind, name, lat, lon] of GEO_LABELS)
      L.marker([lat, lon + off], { pane:'geoLabels', interactive:false, keyboard:false,
        icon: L.divIcon({ className:'', iconSize:[0,0], html:`<span class="geo ${kind}">${name}</span>` }) }).addTo(baseLayer);
  }
}
drawBase(); dark.addEventListener('change', () => { drawBase(); render(); });


// ---------- destination stars ----------
// A five-pointed star, point up, drawn in a box from -1 to 1
const STAR_PTS = Array.from({length:10}, (_, i) => {
  const a = Math.PI/2 + i*Math.PI/5, r = i % 2 ? 0.45 : 1;
  return `${(r*Math.cos(a)).toFixed(3)},${(-r*Math.sin(a)).toFixed(3)}`;
}).join(' ');
// An equilateral triangle, point up, centred on the place
const TRI_PTS = '0,-1 0.866,0.5 -0.866,0.5';
function baseIcon(origin, here){
  const size = 28;   // big enough to stand out from the destination star at the same place
  return L.divIcon({ className: `base-tri ${oKey(origin)}${here ? '' : ' away'}`, iconSize:[size, size], iconAnchor:[size/2, size/2],
    html: `<svg viewBox="-1.1 -1.1 2.2 2.2" width="${size}" height="${size}" aria-hidden="true"><polygon class="halo" points="${TRI_PTS}"/><polygon class="tri" points="${TRI_PTS}"/></svg>` });
}
function starIcon(size, on){
  return L.divIcon({ className: 'dest-star' + (on ? ' on' : ''), iconSize:[size, size], iconAnchor:[size/2, size/2], tooltipAnchor:[size/2, 0],
    html: `<svg viewBox="-1.1 -1.1 2.2 2.2" width="${size}" height="${size}" aria-hidden="true"><polygon points="${STAR_PTS}"/></svg>` });
}

// ---------- themes ----------
// Themes come from map/themes.csv. Which letters belong to a theme is decided by the author in
// map/letter_themes.csv (suggested by map/suggest_themes.py); only confirmed rows are built into this page.
// A letter can have several themes.
const TH = JSON.parse(document.getElementById('themes').textContent);
const TEXTS = JSON.parse(document.getElementById('texts').textContent);
const NAMES = TH.themes.map(t => t.name);
const INFO = Object.fromEntries(TH.themes.map(t => [t.name, t]));
const themesOf = l => TH.letters[String(l.n)] || [];
const BY_THEME = new Map(NAMES.map(t => [t, LET.filter(l => themesOf(l).includes(t))]));
const CONFIRMED = LET.filter(l => themesOf(l).length).length;
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
const countBy = (ls, f) => { const c = {}; ls.forEach(l => { const k = f(l); c[k] = (c[k] || 0) + 1; }); return Object.entries(c).sort((a,b) => b[1]-a[1] || a[0].localeCompare(b[0])); };
const list = rows => rows.map(([k, v]) => `${esc(k)} <span style="opacity:.7">${v}</span>`).join(' · ');
const YEARS = [1897, 1898, 1899, 1900];
const yearOf = l => +l.date.slice(0, 4);

// Three themes at a time get their own colour (more cannot be told apart where lines cross); the reader
// chooses which with the dots in the list. It starts with the three themes with the most letters.
// Letters with no confirmed theme are drawn faintly in grey.
const hasRoute = t => BY_THEME.get(t).some(l => l.dest);
const DEFAULT_SLOTS = NAMES.filter(hasRoute).sort((a,b) => BY_THEME.get(b).length - BY_THEME.get(a).length).slice(0, 3);
while (DEFAULT_SLOTS.length < 3) DEFAULT_SLOTS.push(null);
const SLOTS = DEFAULT_SLOTS.slice();
const colourOf = t => { const i = SLOTS.indexOf(t); return i >= 0 ? `--r${i+1}` : '--other'; };
function toggleColour(t){
  const i = SLOTS.indexOf(t);
  if (i >= 0) SLOTS[i] = null;
  else { const free = SLOTS.indexOf(null); if (free < 0 || !hasRoute(t)) return; SLOTS[free] = t; }
  render(); renderLegend(); renderPanel();
}
const paintBlock = t => !hasRoute(t) ? 'No confirmed letter of this theme has a known destination, so there is no route to colour.'
  : (!SLOTS.includes(t) && !SLOTS.includes(null)) ? 'All three colours are in use. Remove one in the legend at the top first.' : '';
function paintButton(t){
  const on = SLOTS.includes(t), why = paintBlock(t);
  const label = on ? `Remove the colour of ${t}` : why || `Give ${t} a colour on the map`;
  return `<button class="paint" data-paint="${esc(t)}" aria-pressed="${on}" ${why && !on ? 'disabled' : ''} title="${esc(label)}" aria-label="${esc(label)}"><span class="dot" style="--c:var(${colourOf(t)})"></span></button>`;
}

function renderLegend(){
  const lg = document.getElementById('legend');
  if (!CONFIRMED){
    lg.innerHTML = `<span class="key"><i>No themes confirmed yet</i></span><span class="key" style="--c:var(--trace)"><span class="sw"></span>letters</span><span class="key"><span class="sw dash"></span>destination inferred</span>`;
    return;
  }
  const changed = SLOTS.some((t, i) => t !== DEFAULT_SLOTS[i]);
  lg.innerHTML =
    SLOTS.map((t, i) => t
      ? `<span class="key slot" style="--c:var(--r${i+1})"><span class="sw"></span>${esc(t)}<button class="x" data-paint="${esc(t)}" title="Remove the colour of ${esc(t)}" aria-label="Remove the colour of ${esc(t)}">×</button></span>`
      : `<span class="key slot free" style="--c:var(--r${i+1})"><span class="sw"></span>free colour: click a dot in the list</span>`).join('') +
    `<span class="key" style="--c:var(--other)"><span class="sw"></span>other themes</span>` +
    `<span class="key" style="--c:var(--trace)"><span class="sw"></span>no confirmed theme</span>` +
    `<span class="key"><span class="sw dash"></span>destination inferred</span>` +
    (changed ? `<button class="reset" title="Colour the three themes with the most letters again">Reset colours</button>` : '');
  lg.querySelectorAll('[data-paint]').forEach(b => b.onclick = () => toggleColour(b.dataset.paint));
  const reset = lg.querySelector('.reset');
  if (reset) reset.onclick = () => { DEFAULT_SLOTS.forEach((t, i) => SLOTS[i] = t); render(); renderLegend(); renderPanel(); };
}

// ---------- map key ----------
const KeyCtl = L.Control.extend({ options:{position:'bottomleft'}, onAdd(){
  const d = L.DomUtil.create('details','map-key');
  if (innerWidth > 800) d.open = true;
  const ln = (c,w,dash,o=1) => `<svg viewBox="0 0 30 16" aria-hidden="true"><path d="M2 12 Q15 2 28 10" style="fill:none;stroke:var(${c});stroke-width:${w};stroke-linecap:round;opacity:${o}" ${dash?'stroke-dasharray="4 4"':''}/></svg>`;
  d.innerHTML = `<summary>Map Key</summary><ul>
    <li><svg viewBox="0 0 30 16" aria-hidden="true" style="overflow:visible"><polygon points="${TRI_PTS}" transform="translate(7 9) scale(7)" style="fill:var(--hk);stroke:var(--ink);stroke-width:.8px;stroke-linejoin:round;vector-effect:non-scaling-stroke"/><polygon points="${TRI_PTS}" transform="translate(22 9) scale(7)" style="fill:var(--yk);stroke:var(--ink);stroke-width:.8px;stroke-linejoin:round;vector-effect:non-scaling-stroke"/></svg>
      <span><b>Ponce's base</b>: red = Hong Kong, blue = Yokohama <span class="act">· click: letters from here, by theme</span></span></li>
    <li><svg viewBox="0 0 30 16" aria-hidden="true" style="overflow:visible"><polygon points="${STAR_PTS}" transform="translate(7 9) scale(4.5)" style="fill:var(--star);stroke:var(--star-edge);stroke-width:1px;stroke-linejoin:round;vector-effect:non-scaling-stroke"/><polygon points="${STAR_PTS}" transform="translate(21 8) scale(7.5)" style="fill:var(--star);stroke:var(--star-edge);stroke-width:1px;stroke-linejoin:round;vector-effect:non-scaling-stroke"/></svg>
      <span><b>Destination</b>, sized by letters <span class="act">· click: letters received there, by theme</span></span></li>
    <li>${ln('--r1',3)}<span><b>Route</b> of letters on one theme, coloured as in the legend above <span class="act">· click: that theme</span></span></li>
    <li><svg viewBox="0 0 30 16" aria-hidden="true"><circle cx="8" cy="8" r="5" style="fill:var(--r2)"/><circle cx="22" cy="8" r="4.25" style="fill:none;stroke:var(--muted);stroke-width:1.5"/></svg><span><b>Choose the colours</b>: click a dot in the list to colour that theme (three at a time)</span></li>
    <li>${ln('--trace',1.5,false,.6)}<span><b>Grey</b>: letters with no confirmed theme</span></li>
    <li>${ln('--sel',4)}<span><b>Green</b>: the theme you picked; everything else turns grey</span></li>
    <li>${ln('--node',2,true)}<span><b>Dashed</b>: destination inferred</span></li>
  </ul><div class="foot">A letter with several themes is drawn once for each. Click the empty map or press Esc to go back to all themes.</div>`;
  L.DomEvent.disableClickPropagation(d); L.DomEvent.disableScrollPropagation(d);
  return d;
}});
new KeyCtl().addTo(map);
const routeLayer = L.layerGroup().addTo(map);
const nodeLayer = L.layerGroup().addTo(map);

function curve(a, b, bend=0.18, n=40){
  const [y1,x1]=a, [y2,x2]=b, dx=x2-x1, dy=y2-y1;
  const cx=(x1+x2)/2 - dy*bend, cy=(y1+y2)/2 + dx*bend;
  const pts=[]; for(let i=0;i<=n;i++){ const t=i/n, u=1-t; pts.push([u*u*y1+2*u*t*cy+t*t*y2, u*u*x1+2*u*t*cx+t*t*x2]); }
  return pts;
}
// start with the whole world in view: all seven continents and the oceans
const WHOLE_WORLD = [[-80, WEST], [78, EAST]];
map.fitBounds(WHOLE_WORLD);

// ---------- drawing ----------
function shown(l){ return l.dest && (l.dest_kind !== 'inferred' || document.getElementById('inf').checked); }
const routeKey = l => `${l.origin}|${l.dest}|${l.dest_kind==='inferred'?'i':'p'}`;

function render(){
  routeLayer.clearLayers(); nodeLayer.clearLayers();
  const ls = LET.filter(shown);
  // one line per theme per route; letters with no confirmed theme share one grey line per route
  const lines = new Map();
  const add = (theme, l) => {
    const k = `${theme || ''}|${routeKey(l)}`;
    (lines.get(k) || lines.set(k, {theme, origin:l.origin, dest:l.dest, inf:l.dest_kind==='inferred', ls:[]}).get(k)).ls.push(l);
  };
  for (const l of ls){ const ts = themesOf(l); if (ts.length) ts.forEach(t => add(t, l)); else add(null, l); }
  // themes sharing a route are fanned out side by side
  const fans = new Map();
  for (const ln of lines.values()){ const k = `${ln.origin}|${ln.dest}`; (fans.get(k) || fans.set(k, []).get(k)).push(ln); }
  for (const group of fans.values()){
    group.sort((a,b) => (a.theme ? NAMES.indexOf(a.theme) : -1) - (b.theme ? NAMES.indexOf(b.theme) : -1) || a.inf - b.inf);
    group.forEach((ln, i) => ln.bend = 0.18 + (i - (group.length-1)/2) * 0.05);
  }
  // drawing order: no theme first, then other themes, coloured themes, and the picked theme on top
  const rank = ln => ln.theme === S.theme && ln.theme ? 3 : !ln.theme ? 0 : colourOf(ln.theme) === '--other' ? 1 : 2;
  const order = [...lines.values()].sort((a,b) => rank(a) - rank(b) || b.ls.length - a.ls.length);
  for (const ln of order){
    if (ln.origin === ln.dest) continue;
    const on = !!ln.theme && ln.theme === S.theme, off = S.theme && !on;
    const line = L.polyline(curve(ll(ln.origin), ll(ln.dest), ln.bend), {
      color: css(on ? '--sel' : off || !ln.theme ? '--trace' : colourOf(ln.theme)),
      weight: (ln.theme ? 1.2 + Math.sqrt(ln.ls.length)*1.3 : 1) + (on ? 1.5 : 0),
      opacity: on ? 1 : off ? .3 : !ln.theme ? .45 : colourOf(ln.theme) === '--other' ? .75 : .9,
      dashArray: ln.inf ? '5 6' : null, lineCap:'round',
      bubblingMouseEvents:false   // a click on a route should not also count as a click on the empty map
    }).addTo(routeLayer);
    line.bindTooltip(`<b>${ln.theme ? esc(ln.theme) : 'No confirmed theme'}</b><br>${esc(ln.origin)} → ${esc(P[ln.dest].label)}: ${plural(ln.ls.length, 'letter')}${ln.inf?' (inferred)':''}`, {sticky:true});
    line.on('click', e => { if (ln.theme) selectTheme(ln.theme); linePopup(ln, e.latlng); });
  }
  // destination stars; those that received letters on the picked theme get a thick outline
  const byPlace = {}; ls.forEach(l => (byPlace[l.dest] ||= []).push(l));
  for (const [name, pls] of Object.entries(byPlace)){
    const size = Math.round(2.6 * (3 + Math.sqrt(pls.length)*2.2));
    const inTheme = !!S.theme && pls.some(l => themesOf(l).includes(S.theme));
    const m = L.marker(ll(name), { icon: starIcon(size, inTheme), title:`${P[name].label}: ${plural(pls.length, 'letter')}`, riseOnHover:true }).addTo(nodeLayer);
    m.bindTooltip(`${esc(P[name].label)} <span style="opacity:.7">${pls.length}</span>`, {permanent:true, direction:'right', offset:[2,0], className:'plabel'});
    m.on('click', () => themesPopup(P[name].label, 'received', pls, ll(name)));
  }
  // Ponce's two bases
  for (const o of ['Hong Kong','Yokohama']){
    const from = LET.filter(l => l.origin === o);
    const mk = L.marker(ll(o), { icon: baseIcon(o, true), zIndexOffset:1000, keyboard:true, title:`Ponce in ${o}` }).addTo(nodeLayer);
    mk.bindTooltip(`Ponce · ${o}`, {permanent:true, direction:'left', offset:[-10,0], className:'plabel origin'});
    mk.on('click', () => themesPopup(`Ponce in ${o}`, 'sent', from, ll(o)));
  }
}

// ---------- popups ----------
function letterHTML(l){
  const dest = l.dest ? `${esc(P[l.dest].label)}` : 'destination not identified';
  const ts = themesOf(l);
  return `<div class="pop"><h3>No. ${l.n} · ${fmtDate(l.date)}</h3>
    <div class="meta">To <b>${esc(l.recipient)}</b> → ${dest}<br>From ${esc(l.origin)}${l.signed?` · signed “${esc(l.signed)}”`:''}</div>
    ${l.summary?`<div class="sum">${esc(l.summary)}</div>`:''}
    <dl>
      <dt>Themes</dt><dd>${ts.length ? ts.map(esc).join(', ') : 'none confirmed'}</dd>
      <dt>Dateline</dt><dd>${esc(l.dateline)}</dd>
      <dt>Destination</dt><dd>${esc(l.dest_basis)}</dd>
      <dt>Printed pp.</dt><dd>${esc(l.pages)} · ${esc(l.images)}</dd>
    </dl></div>`;
}
function linePopup(ln, latlng){
  L.popup().setLatLng(latlng).setContent(`<div class="pop"><h3>${ln.theme ? esc(ln.theme) : 'No confirmed theme'}</h3>
    <div class="meta">${esc(ln.origin)} → ${esc(P[ln.dest].label)} · ${plural(ln.ls.length, 'letter')}${ln.inf?' · destination inferred':''}</div>
    <ul>${ln.ls.slice().sort((a,b)=>a.date<b.date?-1:1).map(l=>`<li><button class="lk" data-n="${l.n}">No. ${l.n}</button>, ${fmtDate(l.date)}, to ${esc(l.recipient)}</li>`).join('')}</ul></div>`).openOn(map);
}
// letters received at a place, or sent from a base, counted by theme; each theme can be clicked
function themesPopup(title, verb, ls, latlng){
  const rows = NAMES.map(t => [t, ls.filter(l => themesOf(l).includes(t)).length]).filter(([, n]) => n);
  const none = ls.filter(l => !themesOf(l).length).length;
  L.popup().setLatLng(latlng).setContent(`<div class="pop"><h3>${esc(title)}</h3>
    <div class="meta">${plural(ls.length, 'letter')} ${verb}</div>
    <ul>${rows.map(([t, n]) => `<li><button class="pick" data-t="${esc(t)}">${esc(t)}</button> <span style="opacity:.7">(${n})</span></li>`).join('')}
      ${none ? `<li>no confirmed theme <span style="opacity:.7">(${none})</span></li>` : ''}</ul></div>`).openOn(map);
}
map.on('popupopen', e => {
  const el = e.popup.getElement();
  el.querySelectorAll('.lk').forEach(b => b.addEventListener('click', () => selectLetter(+b.dataset.n, true)));
  el.querySelectorAll('.pick').forEach(b => b.addEventListener('click', () => selectTheme(b.dataset.t)));
});

// ---------- picking a theme ----------
function selectTheme(t){
  if (S.theme !== t){ S.theme = t; S.sel = null; render(); renderPanel(); document.getElementById('panel').scrollTop = 0; }
}
// back to all themes: a click on the empty map, the Esc key, or "All themes" in the panel
function clearTheme(){ if (S.theme){ S.theme = null; S.sel = null; map.closePopup(); render(); renderPanel(); } }
map.on('click', clearTheme);
document.addEventListener('keydown', e => { if (e.key === 'Escape') clearTheme(); });
function openLetter(l){
  L.popup({maxWidth:340}).setLatLng(l.dest ? ll(l.dest) : ll(l.origin)).setContent(letterHTML(l)).openOn(map);
}
// open a letter: its details on the map, and its transcript in the panel if it is listed there
function selectLetter(n, open){
  const l = LET.find(x => x.n === n);
  S.sel = l; if (open) openLetter(l);
  const li = document.querySelector(`.tletters li[data-n="${n}"]`);
  if (li){ li.querySelector('details').open = true; li.scrollIntoView({block:'nearest'}); }
}

// Pie slices as SVG paths in a box from -50 to 50, clockwise from the top. Each item: {n, fill, title, attrs}.
function piePaths(items, total){
  const R = 50, pt = t => `${(R*Math.cos(t)).toFixed(2)},${(R*Math.sin(t)).toFixed(2)}`;
  let a = -Math.PI / 2;
  return items.map(it => {
    if (!it.n) return '';
    const b = a + it.n / total * 2 * Math.PI, d = `M0,0 L${pt(a)} A${R},${R} 0 ${b - a > Math.PI ? 1 : 0} 1 ${pt(b)} Z`;
    a = b;
    return `<path d="${d}" style="fill:var(${it.fill})" ${it.attrs || ''}><title>${esc(it.title)}</title></path>`;
  }).join('');
}
function yearChart(years, total){
  const used = years.filter(([, n]) => n);
  if (used.length === 1) return `<p class="one-year">${total === 1 ? 'The only letter is' : total === 2 ? 'Both letters are' : `All ${total} letters are`} from ${used[0][0]}.</p>`;
  const pct = n => Math.round(n / total * 100);
  const slices = piePaths(years.map(([y, n], i) => ({ n, fill:`--y${i+1}`, title:`${y}: ${plural(n, 'letter')} (${pct(n)}%)` })), total);
  const label = years.map(([y, n]) => `${y}: ${n}`).join(', ');
  return `<div class="yearpie"><svg viewBox="-51 -51 102 102" role="img" aria-label="Letters per year: ${label}">${slices}</svg>
    <div class="ylegend">${years.map(([y, n], i) => `<span class="sq${n ? '' : ' none'}" style="--c:var(--y${i+1})"></span><span class="${n ? '' : 'none'}">${y}</span><span class="v${n ? '' : ' none'}">${n}</span><span class="pc">${n ? pct(n) + '%' : ''}</span>`).join('')}</div></div>`;
}

// ---------- the panel: all themes, or one theme ----------
function renderPanel(){
  const panel = document.getElementById('panel'), title = document.getElementById('panelTitle'), meta = document.getElementById('panelMeta');
  if (!S.theme){
    title.textContent = 'Themes';
    meta.textContent = `${plural(NAMES.length, 'theme')} · ${CONFIRMED} of ${LET.length} letters have a confirmed theme` + (CONFIRMED ? ' · click a dot to colour a theme' : '');
    const note = CONFIRMED ? '' : `<p class="note">No themes have been confirmed yet. Suggested themes are reviewed in <code>map/letter_themes.csv</code>; once confirmed, they appear here and on the map.</p>`;
    panel.innerHTML = note + (NAMES.length ? `<ul class="who-list">${NAMES.map(t => {
      const n = BY_THEME.get(t).length, pending = TH.pending[t] || 0;
      return `<li>${paintButton(t)}<button class="row" data-t="${esc(t)}"><span class="nm">${esc(t)}</span><span class="n">${plural(n, 'letter')}</span>
        <span class="places">${INFO[t].description ? esc(INFO[t].description) + ' · ' : ''}${pending ? `${pending} more suggested, awaiting review` : 'words: ' + esc(INFO[t].words.join(', '))}</span></button></li>`; }).join('')}</ul>`
      : '<p class="empty">No themes are listed in map/themes.csv.</p>');
    panel.querySelectorAll('button[data-t]').forEach(b => b.onclick = () => selectTheme(b.dataset.t));
    panel.querySelectorAll('button[data-paint]').forEach(b => b.onclick = () => toggleColour(b.dataset.paint));
    return;
  }
  const t = S.theme, ls = BY_THEME.get(t).slice().sort((a,b) => a.date < b.date ? -1 : a.date > b.date ? 1 : a.n - b.n);
  title.textContent = 'Theme';
  meta.textContent = '';
  const pending = TH.pending[t] || 0;
  const years = YEARS.map(y => [y, ls.filter(l => yearOf(l) === y).length]);
  panel.innerHTML = `<div class="profile">
      <button class="back">← All themes</button>
      <h3><span class="dot" style="--c:var(${colourOf(t)})"></span>${esc(t)}</h3>
      ${hasRoute(t) ? `<button class="paint-wide" data-paint="${esc(t)}" ${paintBlock(t) && !SLOTS.includes(t) ? `disabled title="${esc(paintBlock(t))}"` : ''}>${SLOTS.includes(t) ? 'Remove colour' : paintBlock(t) ? 'All three colours are in use' : 'Give a colour on the map'}</button>` : ''}
      ${INFO[t].description ? `<p class="bio">${esc(INFO[t].description)}</p>` : ''}
      <dl class="facts">
        <dt>Letters</dt><dd>${ls.length ? `${ls.length}, ${fmtDate(ls[0].date)}${ls.length > 1 ? ` – ${fmtDate(ls[ls.length-1].date)}` : ''}` : 'none confirmed yet'}${pending ? ` · ${pending} more suggested, awaiting review` : ''}</dd>
        <dt>Words</dt><dd>${esc(INFO[t].words.join(', '))}</dd>
        ${ls.length ? `<dt>To</dt><dd>${list(countBy(ls, l => l.recipient).slice(0, 6))}${new Set(ls.map(l => l.recipient)).size > 6 ? ' …' : ''}</dd>
        <dt>Sent to</dt><dd>${list(countBy(ls, l => l.dest ? P[l.dest].label : 'no known destination'))}</dd>` : ''}
      </dl>
      ${ls.length ? `<h4>Letters per year</h4>${yearChart(years, ls.length)}<h4>Letters</h4><p class="hint-small">Click a letter to read its transcript.</p>` : ''}
    </div>
    <ul class="tletters">${ls.map(l => `<li data-n="${l.n}"><details><summary>
      <span class="no">${l.n}<small>${l.date.slice(0,4)}</small></span>
      <span class="who">${esc(l.recipient)}</span>
      <span class="where"><span class="o ${oKey(l.origin)}">${esc(l.origin)}</span> → ${l.dest ? esc(P[l.dest].label) : 'place unknown'}${l.dest_kind==='inferred'?'<span class="tag">inferred</span>':''} · ${fmtDate(l.date)}</span>
    </summary><div class="tx">
      ${l.summary ? `<p class="sum">${esc(l.summary)}</p>` : ''}
      ${themesOf(l).length > 1 ? `<p class="tags">Also: ${themesOf(l).filter(x => x !== t).map(esc).join(', ')}</p>` : ''}
      <div class="text">${esc(TEXTS[String(l.n)] || 'No transcript.')}</div>
      <button class="show" data-n="${l.n}">Show on the map</button>
    </div></details></li>`).join('')}</ul>`;
  panel.querySelector('.back').onclick = clearTheme;
  const pw = panel.querySelector('.paint-wide'); if (pw) pw.onclick = () => toggleColour(t);
  panel.querySelectorAll('.show').forEach(b => b.onclick = () => openLetter(LET.find(x => x.n === +b.dataset.n)));
}

document.getElementById('inf').onchange = render;

// ---------- minimize / maximize the panel ----------
const regToggle = document.getElementById('regToggle'), mainEl = document.querySelector('main');
regToggle.onclick = () => {
  const wasWholeWorld = map.getZoom() <= map.getMinZoom() + 0.01;
  const min = mainEl.classList.toggle('reg-min');
  const label = min ? 'Show the list of themes' : 'Minimize the list of themes';
  regToggle.textContent = min ? '+' : '–';
  regToggle.setAttribute('aria-expanded', String(!min));
  regToggle.title = label; regToggle.setAttribute('aria-label', label);
  map.invalidateSize();   // the map is now wider or narrower; this also updates the zoom-out limit
  if (wasWholeWorld) map.fitBounds(WHOLE_WORLD, {animate:false});   // keep showing the whole world
};
renderLegend(); render(); renderPanel();
})();
</script>
</body>
</html>
